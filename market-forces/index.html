function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
  g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
  b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function onColour(hex) { return lum(hex) > 0.62 ? '#122036' : '#FFFFFF'; }
function toast(msg) {

/* ---------------- router ---------------- */
function paintRanges(root) {
  qa('input[type=range]', root || document).forEach(el => {
    const mn = +el.min || 0, mx = (+el.max || 100), v = +el.value;
    el.style.setProperty('--pct', Math.max(0, Math.min(100, (v - mn) / (mx - mn) * 100)) + '%');
  });
}

/* Sticky bars have to know how tall the top bar is, and the top bar grows when
   the student turns the text size up. Measuring beats guessing. */
function measureTopbar() {
  const tb = q('.topbar');
  if (!tb) return;
  const h = tb.getBoundingClientRect().height;
  if (h > 0) document.documentElement.style.setProperty('--topbar-h', h.toFixed(1) + 'px');
}
function go(id) {
  S.scene = id;
  const sc = SCENES[id];
  if (!sc) { console.warn('no scene', id); return; }
  paintTop();
  q('#app').innerHTML = sc.html();
  if (sc.mount) sc.mount();
  paintRanges();
  taskSync();
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { }
}
function repaint() {
  const sc = SCENES[S.scene];
  q('#app').innerHTML = sc.html();
  if (sc.mount) sc.mount();
  paintRanges();
  taskSync();
}
function bindGlobals() {
  measureTopbar();
  window.addEventListener('resize', measureTopbar);
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-a]');
    if (!t) return;
    const fn = ACTS[t.dataset.a];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && q('#taskoverlay') && q('#taskoverlay').classList.contains('show')) ACTS['task-close']();
  });
  /* A crew size counts as "tested" when the student lets go of the slider, not
     while they are dragging through it — otherwise one sweep would fill the
     whole notebook and there would be nothing left to discover. */
  document.addEventListener('change', e => {
    const t = e.target.closest && e.target.closest('[data-i]');
    if (!t || t.dataset.i !== 'lab-l' || S.scene !== 'lab') return;
    discover(S.lab.K, S.lab.L);

  document.addEventListener('input', e => {

    if (t && t.type === 'range') paintRanges(t.parentElement || document);
    if (!t) return;
    const fn = ACTS[t.dataset.i];
    if (fn) fn(t, e);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
}

const VIEWS = {};
function drawViews(root) {
  qa('[data-view]', root || document).forEach(el => {

/* ---- reusable: the perfect-competition firm diagram ---- */
function cfgPCFirm(w, o) {
  const K = o.K, P = o.P, L = o.L;
  const qMax = ECON.capacity(K) * 1.01;
  const yMax = o.yMax || 74;
  const ser = [];
  const mk = (fn, color, label) => {
    const pts = [];
    /* only the rising branch of total product: past its peak the same output
       would need fewer workers, so a cost curve drawn there would double back */
    for (let l = 0.25; l <= K * ECON.X_TPP; l += 0.25) {
      const x = ECON.output(K, l), y = fn(K, l);
      if (x <= qMax && y <= yMax) pts.push([x, y]);
    }
    if (pts.length) ser.push({ pts, color, width: 2.8, label });
  };
  mk(ECON.mc, PAL.red, 'MC');
  mk(ECON.ac, PAL.blue, 'AC');
  if (o.showAVC !== false) mk(ECON.avc, PAL.green, 'AVC');
  if (o.showAFC) mk(ECON.afc, PAL.violet, 'AFC');

  const Q = ECON.output(K, L), AC = ECON.ac(K, L);
  const profit = ECON.profit(K, L, P);
  const shapes = [], points = [], vlines = [], hlines = [];
  hlines.push({ y: P, color: PAL.ink, dash: '7 5', label: `P = MR = AR = $${fmt(P, 0)}`, labelSide: 'left' });

  if (o.showProfit !== false && L > 0 && Q > 0) {
    const top = Math.max(AC, P), bot = Math.min(AC, P);
    shapes.push({ type: 'rect', x0: 0, y0: top, x1: Q, y1: bot, fill: profit >= 0 ? PAL.green : PAL.red, opacity: .17, stroke: profit >= 0 ? PAL.green : PAL.red, sw: 1.5, dash: '4 3' });
    vlines.push({ x: Q, color: PAL.guide, label: `Q = ${fmt(Q, 1)}` });
    points.push({ x: Q / 2, y: (AC + P) / 2, color: profit >= 0 ? PAL.green : PAL.red, r: 0, label: profit >= 0 ? 'profit box' : 'loss box', dx: -4, anchor: 'middle' });
  }
  return {
    w, h: Math.round(Math.min(580, Math.max(360, w * 0.66))),
    x: [0, qMax], y: [0, yMax],
    xLabel: 'Output Q (units per period)', yLabel: 'Cost per unit ($)',
    series: ser, shapes, points, vlines, hlines
  };
}

/* ============================================================
   DISCOVERY
   The lab does not hand the data over. A crew size only appears in the table
   once the student has actually stopped on it — and the curves are drawn through
   the points they have found, and no further. The tasks ("where does MP peak?")
   then cannot be answered by reading; they have to be hunted for.
   "Reveal the whole table" is there for the teacher who wants to talk over the
   finished picture.
   ============================================================ */
const LAB_PRICE = { f_p40: 40, f_p24: 24, f_p16: 16 };
const LAB_PRICE_HINT = {
  f_p40: 'a good year \u2014 find the crew that earns the most',
  f_p24: 'thin margins \u2014 do you keep going?',
  f_p16: 'a bad year \u2014 or a year to stop?'
};
function labFound(K) { S.lab.found = S.lab.found || {}; return (S.lab.found[K] = S.lab.found[K] || {}); }
function isKnown(K, L) { return !!S.lab.all || !!labFound(K)[L]; }
function discover(K, L) { if (L == null || L < 0) return; labFound(K)[L] = 1; }
function knownLevels(K) {
  const out = [];
  for (let L = 0; L <= ECON.maxL(K); L++) if (isKnown(K, L)) out.push(L);
  return out;
}
function labTaskNow() { return S.lab.task || 'f_p40'; }
function labNotebookCount(K) { return knownLevels(K).length; }

/* The live numbers, rendered inside the control card so they sit right next to
   the sliders and can be watched while something is being moved. Refreshed by
   softLabUpdate() without re-rendering the controls, so a drag never breaks. */
function labReadout() {
  const K = S.lab.K, L = S.lab.L;
  const ro = (label, value, cls) =>
    `<div class="ro${cls ? ' ' + cls : ''}"><div class="rl">${label}</div><div class="rv">${value}</div></div>`;
  if (S.lab.tab === 'costs') {
    return ro('Output Q', fmt(ECON.output(K, L), 1), 'hi')
      + ro('Total cost', money(ECON.tc(K, L)))
      + ro('Average cost', L ? money(ECON.ac(K, L), 2) : '\u2014')
      + ro('Average variable cost', L ? money(ECON.avc(K, L), 2) : '\u2014')
      + ro('Marginal cost', L ? money(ECON.mc(K, L), 2) : '\u2014');
  }
  if (S.lab.tab === 'profit') {
    const P = LAB_PRICE[labTaskNow()];
    const Q = ECON.output(K, L), TR = P * Q, TC = ECON.tc(K, L), pf = TR - TC;
    return ro('Market price', '$' + P, 'hi')
      + ro('Output', fmt(Q, 1))
      + ro('Total revenue', money(TR))
      + ro('Total cost', money(TC))
      + ro('Economic profit', money(pf), pf >= 0 ? 'pos' : 'neg')
      + ro('Marginal cost', L ? money(ECON.mc(K, L), 2) : '\u2014');
  }
  const mpv = L ? ECON.mp(K, L) : 0;
  return ro('Output Q', fmt(ECON.output(K, L), 1), 'hi')
    + ro('Marginal product', L ? fmt(mpv, 2) : '\u2014', mpv < 0 ? 'neg' : '')
    + ro('Average product', L ? fmt(ECON.ap(K, L), 2) : '\u2014')
    + ro('Labour cost', money(ECON.WAGE * L));
}

    hi = Math.max(hi, m, a); lo = Math.min(lo, m);
  }
  const known = knownLevels(K).filter(l => l > 0);
  known.forEach(l => { mp.push([l, ECON.mp(K, l)]); ap.push([l, ECON.ap(K, l)]); });
  const ser = [];
  if (ap.length > 1) ser.push({ pts: ap, color: PAL.green, width: 3, label: 'AP' });
  if (mp.length > 1) ser.push({ pts: mp, color: PAL.red, width: 3, label: 'MP' });
  /* the axis has to go below zero, or the workers who REDUCE output fall off
     the bottom of the chart instead of showing up as a falling curve */
  return chart({
    w, h: Math.round(Math.min(460, Math.max(280, w * 0.52))), x: [0, top],
    y: [lo < 0 ? Math.floor(lo * 1.18) : 0, Math.max(4, Math.ceil(hi * 1.12))],
    xLabel: 'Workers hired', yLabel: 'Product per worker',
    series: ser,
    hlines: lo < 0 ? [{ y: 0, color: PAL.guide, label: 'MP = 0', labelSide: 'left' }] : [],
    points: (S.lab.L ? [{ x: S.lab.L, y: ECON.mp(K, S.lab.L), color: PAL.red, r: 5.5 }, { x: S.lab.L, y: ECON.ap(K, S.lab.L), color: PAL.green, r: 5.5 }] : []),
    note: ser.length ? (lo < 0 ? 'past the peak, another worker lowers output' : '') : 'test a crew size to plot it'
  });
};
VIEWS['lab-costs'] = w => {
  const K = S.lab.K;
  const yMax = 70, ser = [];
  /* only the crew sizes the student has tested, and only the rising branch of
     total product: past its peak the same output would need fewer workers, so a
     cost curve drawn there would double back on itself */
  const known = knownLevels(K).filter(l => l > 0 && l <= K * ECON.X_TPP);
  const add = (fn, color, label) => {
    const pts = known.map(l => [ECON.output(K, l), fn(K, l)]).filter(p => p[1] <= yMax);
    if (pts.length > 1) ser.push({ pts, color, width: 3, label });
  };
  add(ECON.mc, PAL.red, 'MC');
  add(ECON.ac, PAL.blue, 'AC');
  add(ECON.avc, PAL.green, 'AVC');
  add(ECON.afc, PAL.violet, 'AFC');
  const minAcL = labPeerL('ac');
  const minAc = ECON.ac(K, minAcL);
  const minKnown = isKnown(K, minAcL);
  const Q = ECON.output(K, S.lab.L);
  return chart({
    w, h: Math.round(Math.min(520, Math.max(330, w * 0.62))),
    x: [0, ECON.capacity(K) * 1.02], y: [0, yMax],
    xLabel: 'Output Q (units per period)', yLabel: 'Cost per unit ($)',
    series: ser,
    points: minKnown ? [{ x: ECON.output(K, minAcL), y: minAc, color: PAL.ink, r: 5.5, label: `lowest AC = ${money(minAc, 2)}`, dy: -11, anchor: 'middle', dx: 0 }] : [],
    vlines: S.lab.L ? [{ x: Q, color: PAL.guide, label: `you: Q=${fmt(Q, 1)}` }] : [],
    note: ser.length ? '' : 'test a crew size to plot it'
  });
};
VIEWS['lab-profit'] = w => chart(cfgPCFirm(w, { K: S.lab.K, P: LAB_PRICE[labTaskNow()], L: S.lab.L, showProfit: true }));

/* ---------------- lab interactions ---------------- */
ACTS['lab-l'] = t => { S.lab.L = +t.value; softLabUpdate(); };
/* the market price is chosen by the task, never by the student */
ACTS['lab-task'] = t => {
  S.lab.task = t.dataset.v;
  S.lab.L = 0;                     // a clean slate for the new price
  discover(S.lab.K, 0);
  repaint();
};
ACTS['lab-reveal'] = () => {
  S.lab.all = true;
  toast('Every crew size is now filled in \u2014 the whole curve is on the charts.');
  repaint();
};
ACTS['lab-k'] = t => { S.lab.K = +t.dataset.v; repaint(); };

/* ---- banking a task is the only way to earn lab insight, and the only way to
   open the gate. Both read the same registry, so they cannot disagree. ---- */
function bankLab(ids, okMsg, missMsg) {
  let got = 0;
  ids.forEach(id => {
    const t = LAB_TASKS.filter(x => x.id === id)[0];
    if (t.met() && !S.lab.missions[id]) got += awardLabTask(id);
  });
  if (got) toast(`+${got} Insight \u00b7 ` + okMsg);
  else toast(missMsg);
  softLabUpdate(); paintTop();
}

ACTS['lab-check-prod'] = () => bankLab(['p_mp', 'p_ap'], 'production function cracked',
  'Not quite \u2014 move the slider and watch how MP and AP behave.');
ACTS['lab-check-cost'] = () => bankLab(['c_minac', 'c_shut'], 'cost curves mapped',
  'Not yet \u2014 find the lowest point of the AC curve, then of the AVC curve.');
ACTS['lab-check-profit'] = () => {
  let got = 0;
  ['f_p40', 'f_p24', 'f_p16'].forEach(id => {
    const t = LAB_TASKS.filter(x => x.id === id)[0];
    if (t.met() && !S.lab.missions[id]) got += awardLabTask(id);
  });
  if (got) toast(`+${got} Insight \u00b7 the profit rule is yours`);
  else if (labTaskNow() === 'f_p16') toast('At $16 the price is below average variable cost \u2014 every unit adds to your loss, so shut down.');
  else if (labTaskNow() === 'f_p24') toast('This price still covers average variable cost, so carry on \u2014 but find the crew that keeps the loss smallest.');
  else toast('Not the best crew yet \u2014 keep moving the slider and watch the profit figure.');
  softLabUpdate(); paintTop();
};
ACTS['lab-finish'] = () => {
  if (gateOpen()) {
    const miss = gateMissing()[0];
    if (miss && miss.group) {
      S.lab.tab = miss.group;
      if (miss.group === 'profit') { S.lab.task = miss.id; S.lab.L = 0; }
    }
    toast(gateMessage());
    repaint();
    return;
  }
  S.K = S.lab.K; S.L = S.lab.L;
  S.chIdx = 0; S.beat = 0;
  enterBeat();
  go('chapter');
};

/* ============================================================
   MARKET FORCES — chapter engine + Chapter 1 (Perfect Competition),
   plus the shared monopolistic-competition firm diagram.
   Playing order lives in CHAPTERS (03_ui.js): pc → mono → mc → oligo.
   ============================================================ */

const BEATS = {};

/* Beats are built lazily (as functions) because their text is filled with the
   student's own product, colour and firm name — all of which are only known
   after the setup screen. Building them at load time would freeze "bakery"
   into a run where the student chose soap. */
function beatsFor(id) { const b = BEATS[id]; return typeof b === 'function' ? b() : (b || []); }
function curBeats() { return beatsFor(S.chs[S.chIdx]); }
function curBeat() { return curBeats()[S.beat]; }

function enterBeat() {
  const b = curBeat();
  S.locked = false; S.res = null; S.checkAns = null; S.pick = null;
  if (!b) return;
  if (b.setup) S.dec = Object.assign({ ad: 0, variant: 0, monoK: 3, welfare: true }, typeof b.setup === 'function' ? b.setup() : b.setup);
  if (b.onEnter) b.onEnter();
}
function advance() {
  /* one gate for the whole game: a step is finished when its task list says so */
  if (gateOpen()) { toast(gateMessage()); return; }
  S.beat++;
  if (S.beat >= curBeats().length) {
    S.chIdx++;
    S.beat = 0;
    if (S.chIdx >= S.chs.length) { go('debrief'); return; }
  }
  enterBeat();
  go('chapter');
}

/* ---------------- scene: chapter ---------------- */
SCENES.chapter = {
  html() {
    const ch = chapter(), beats = curBeats(), b = beats[S.beat];
    const dots = beats.map((x, i) => `<span class="stepdot ${i < S.beat ? 'done' : i === S.beat ? 'on' : ''}" style="text-transform:none;letter-spacing:0">${i < S.beat ? '\u2713' : i + 1}</span>`).join('');
    return `
    <div class="card tight" style="display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:.6rem">
        <span class="ch-icon">${chicon(ch.id)}</span>
        <div><div class="kicker">Chapter ${ch.n} of ${S.chs.length} &middot; ${ch.tag}</div><h2 style="margin:0">${ch.title}</h2></div>
      </div>
      <div class="steps" style="margin:0">${dots}</div>
    </div>
    ${renderBeat(b)}`;
  },
  mount() { mountBeat(); }
};

function renderBeat(b) {
  if (!b) return '';
  if (b.t === 'intro') return beatIntro(b);
  if (b.t === 'event') return beatEvent(b);
  if (b.t === 'decision') return beatDecision(b);
  if (b.t === 'check') return beatCheck(b);
  if (b.t === 'report') return beatReport(b);
  return '';
}
function mountBeat() {
  const b = curBeat();
  if (b && b.mount) b.mount();
  drawViews();
  bindDecisionInputs();
}
function bindDecisionInputs() {
  const m = { 'dec-l': 'dec-l', 'dec-p': 'dec-p', 'dec-k': 'dec-k', 'dec-soc': 'dec-soc' };
  // handled through the global data-i delegate
}

/* ---------------- beat renderers ---------------- */
function beatTitle(b){ return typeof b.title === "function" ? b.title() : b.title; }

ACTS['intro-pick'] = t => { S.pick = t.dataset.v; if (curBeat().onPick) curBeat().onPick(t.dataset.v); repaint(); };

/* ---------------- report beat ---------------- */
function beatReport(b) {

/* ============================================================
   DECISION BEAT
   ============================================================ */
function beatDecision(b) {
  if (b.kind === 'pc') return decPC(b);
  if (b.kind === 'mc') return decMC(b);
  if (b.kind === 'oligo') return decOligo(b);
  if (b.kind === 'mono') return decMono(b);
  if (b.kind === 'buyer') return decBuyer(b);
  return '';
}

/* Chart-first workspace: the diagram leads on the left; controls, live numbers
   and market position share a compact, sticky rail on the right. */
function decShell(b, ctl, out, chartViews, foot) {
  const brief = typeof b.brief === 'function' ? b.brief() : b.brief;
  const head = `
    <div class="kicker">Decision &middot; ${b.tag || chapter().title}</div>
    <h2>${typeof b.title === 'function' ? b.title() : b.title}</h2>

    ${b.context || ''}`;
  if (!chartViews) {
    return `
  <div class="card fade">${head}
    <div class="decwork decwork-nc">
      <div class="decmatrix">${out}</div>
      <aside class="decrail">${ctl}${foot || ''}</aside>
    </div>
  </div>`;
  }
  return `
  <div class="card fade">${head}
    <div class="decwork">
      <div class="decchart">${chartViews}</div>
      <aside class="decrail">${ctl}${out}${foot || ''}</aside>
    </div>
  </div>`;
}

/* ---------------- Chapter 1: perfect competition decisions ---------------- */
function decPC(b) {
  const P = S.dec.P, K = S.dec.K, L = S.dec.L;
  const Q = ECON.output(K, L), TR = P * Q, TC = ECON.tc(K, L), profit = TR - TC;
  const AC = L ? ECON.ac(K, L) : 0, MC = L ? ECON.mc(K, L) : 0;
  const best = ECON.bestL(K, P);
  if (S.locked) {
    const good = profit > 0;
    return `
    <div class="card ${good ? 'event good' : 'event bad'} fade">
      <div class="kicker">Result &middot; season ${b.season || ''}</div>
      <h2>${good ? 'A profitable season' : 'A season in the red'}</h2>
      <div class="tiles">
        <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(Q, 1)}</div><div class="ts">units</div></div>
        <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(TR)}</div><div class="ts">$${fmt(P, 0)} \u00d7 ${fmt(Q, 1)}</div></div>
        <div class="tile"><div class="tl">Total cost</div><div class="tv">${money(TC)}</div><div class="ts">AC = ${money(AC, 2)}</div></div>
        <div class="tile ${good ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(profit)}</div><div class="ts">added to firm value</div></div>
      </div>
      <div class="chartcard" data-view="dec-pc-chart"></div>
      ${b.after(profit, best)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }
  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">Workers you hire this period</span><span class="v" id="ctlL">${L}</span></div>
      ${sliderRow('dec-l', 0, ECON.maxL(K), 1, L, ticksFor(ECON.maxL(K)))}
    </div>`;
  const out = `
    <div class="tiles">
      <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(Q, 1)}</div><div class="ts">${prod().unitPl} per period</div></div>
      <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(TR)}</div><div class="ts">market price $${fmt(P, 0)}</div></div>
      <div class="tile"><div class="tl">Total cost</div><div class="tv">${money(TC)}</div><div class="ts">AC = ${L ? money(AC, 2) : '\u2014'}</div></div>
      <div class="tile ${profit >= 0 ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(profit)}</div><div class="ts">TR \u2212 TC</div></div>
      <div class="tile ${L && MC > P ? 'warn' : ''}"><div class="tl">MC</div><div class="tv">${L ? money(MC, 2) : '\u2014'}</div><div class="ts">${L ? (MC > P ? 'MC above price' : 'MC below price') : 'not producing'}</div></div>
    </div>`;
  const foot = `
    <div class="card tight" data-note="flat">
      <div class="small" style="font-weight:800">Your market position</div>
      <div class="scoreline"><span>Market price</span><b>$${fmt(P, 0)}</b></div>
      <div class="scoreline"><span>Your share of the town market</span><b>about ${fmt(Q / ECON.marketQ(P) * 100, 0)}%</b></div>
      <div class="scoreline"><span>Can you influence the price?</span><b>No</b></div>
      <div class="scoreline" style="border:none"><span>Fixed cost you pay anyway</span><b>${money(ECON.tfc(K))}</b></div>
      <div class="small muted" style="margin-top:.4rem">You are one of many identical sellers. The town's price is not yours to set.</div>
    </div>
    <div class="btnrow"><button class="btn primary wide big" data-a="dec-lock">Lock in the decision</button></div>`;
  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-pc-chart"></div>`, foot);
}

/* ---------------- monopolistic competition (chapter 3) ---------------- */
const AD_LEVELS = [
  { v: 0, label: 'No advertising', spend: 0, mult: 1.0 },
  { v: 1, label: 'Local posters', spend: 140, mult: 1.40 },
  { v: 2, label: 'Full campaign', spend: 380, mult: 1.80 }
];
function mcFirm(K, P, mult, adSpend, L) {
  const qd = Math.max(0, (120 - 2.2 * P) * mult);
  const qp = ECON.output(K, L);
  const sold = Math.min(qd, qp);
  const tc = ECON.tc(K, L) + adSpend;
  const tr = P * sold;
  return { qd, qp, sold, tc, tr, profit: tr - tc, lost: Math.max(0, qd - qp) };
}
function decMC(b) {
  const K = S.dec.K, P = S.dec.P, L = S.dec.L, ad = S.dec.ad, mult = S.dec.mult || 1;
  const adLv = AD_LEVELS[ad];
  const r = mcFirm(K, P, mult * adLv.mult, adLv.spend, L);
  if (S.locked) {
    const good = r.profit > 0;
    return `
    <div class="card ${good ? 'event good' : 'event bad'} fade">
      <div class="kicker">Result</div>
      <h2>${good ? 'Your version is selling' : 'A hard season'}</h2>
      <div class="tiles">
        <div class="tile"><div class="tl">Customers wanted</div><div class="tv">${fmt(r.qd, 1)}</div><div class="ts">at $${fmt(P, 0)}</div></div>
        <div class="tile"><div class="tl">You produced</div><div class="tv">${fmt(r.qp, 1)}</div><div class="ts">${r.lost > 0.05 ? '<b style="color:var(--bad)">' + fmt(r.lost, 1) + ' customers turned away</b>' : 'demand covered'}</div></div>
        <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(r.tr)}</div><div class="ts">$${fmt(P, 0)} \u00d7 ${fmt(r.sold, 1)}</div></div>
        <div class="tile"><div class="tl">Costs</div><div class="tv">${money(r.tc)}</div><div class="ts">incl. ${money(adLv.spend)} advertising</div></div>
        <div class="tile ${good ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(r.profit)}</div><div class="ts">added to firm value</div></div>
      </div>
      <div class="chartcard" data-view="dec-mc-chart"></div>
      ${b.after(r)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }
  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">Your price</span><span class="v" id="ctlP">$${fmt(P, 0)}</span></div>
      ${sliderRow('dec-p', 24, 52, 1, P, '<div class="ticks"><span>$24</span><span>$38</span><span>$52</span></div>')}
    </div>
    <div class="ctl">
      <div class="clab"><span class="t">Advertising budget</span><span class="v">${money(adLv.spend)}</span></div>
      <div class="optrow">${AD_LEVELS.map(a => `<button class="opt ${ad === a.v ? 'sel' : ''}" data-a="dec-ad" data-v="${a.v}">${a.label}<small>${a.spend ? money(a.spend) + ' \u00b7 demand \u00d7' + fmt(a.mult, 2) : 'free'}</small></button>`).join('')}</div>
    </div>
    <div class="ctl">
      <div class="clab"><span class="t">Workers \u2014 production capacity</span><span class="v" id="ctlL">${L}</span></div>
      ${sliderRow('dec-l', 0, ECON.maxL(S.dec.K), 1, L, ticksFor(ECON.maxL(S.dec.K)))}
      <div class="small muted" style="margin-top:.25rem">Demand at your price is <b>${fmt(r.qd, 1)} units</b>; your workers can make <b>${fmt(r.qp, 1)}</b>.</div>
    </div>`;
  const out = `
    <div class="tiles">

    </div>`;
  const foot = `

}
ACTS['dec-ad'] = t => { S.dec.ad = +t.dataset.v; res(); };
ACTS['dec-match'] = () => {
  const K = S.dec.K, P = S.dec.P, mult = S.dec.mult || 1, adLv = AD_LEVELS[S.dec.ad];
  const qd = Math.max(0, (120 - 2.2 * P) * mult * adLv.mult);
  let bestL = 0, bestD = Infinity;
  for (let l = 0; l <= 14; l++) { const d = Math.abs(ECON.output(K, l) - qd); if (d < bestD) { bestD = d; bestL = l; } }
  S.dec.L = bestL; res();
};

/* ---------------- lock ---------------- */
ACTS['dec-lock'] = () => {
  const b = curBeat();
  S.locked = true;
  if (b.kind === 'pc') {
    const profit = ECON.profit(S.dec.K, S.dec.L, S.dec.P);
    S.insight += (S.dec.L === ECON.bestL(S.dec.K, S.dec.P).L) ? 10 : 0;
    logRun(chapter().id, `${b.label || 'Season'} \u2014 price $${S.dec.P}`, profit);
    addValue(profit);
  } else if (b.kind === 'mc') {
    const adLv = AD_LEVELS[S.dec.ad];
    const r = mcFirm(S.dec.K, S.dec.P, (S.dec.mult || 1) * adLv.mult, adLv.spend, S.dec.L);
    logRun(chapter().id, `${b.label || 'Season'} \u2014 price $${fmt(S.dec.P, 0)}`, r.profit);
    addValue(r.profit);
  } else if (b.kind === 'oligo') {
    lockOligo(b);
  } else if (b.kind === 'mono') {
    lockMono(b);
  } else if (b.kind === 'buyer') {
    lockBuyer(b);
  }
  repaint();
  paintTop();
};
ACTS['dec-l'] = t => { S.dec.L = +t.value; res(); };
ACTS['dec-p'] = t => { S.dec.P = +t.value; res(); };
ACTS['dec-k'] = t => { S.dec.K = +t.dataset.v; res(); };
ACTS['dec-welfare'] = () => { S.dec.welfare = !S.dec.welfare; res(); };

VIEWS['dec-pc-chart'] = w => chart(cfgPCFirm(w, { K: S.dec.K, P: S.dec.P, L: S.dec.L, showProfit: true }));

function cfgMCFirm(w, o) {
  const K = o.K, mult = o.mult;
  const qMax = 62, yMax = 76;
  const dem = [], mr = [], mc = [], ac = [];
  for (let q = 0; q <= qMax; q += 1) {
    dem.push([q, 54.55 - 0.4545 * q / mult]);
    mr.push([q, 54.55 - 0.909 * q / mult]);
  }
  for (let l = 1; l <= Math.min(14, K * ECON.X_TPP); l++) {
    const q = ECON.output(K, l);
    if (q <= qMax) { mc.push([q, ECON.mc(K, l)]); ac.push([q, ECON.ac(K, l)]); }
  }
  const filter = a => a.filter(p => p[1] <= yMax && p[1] >= 0);
  const r = o.res;
  const shapes = [], points = [], hlines = [], vlines = [];
  if (r && r.sold > 0.05) {
    const acHere = r.tc / r.qp;
    shapes.push({ type: 'rect', x0: 0, y0: Math.max(acHere, o.P), x1: r.sold, y1: Math.min(acHere, o.P), fill: r.profit >= 0 ? PAL.green : PAL.red, opacity: .17, stroke: r.profit >= 0 ? PAL.green : PAL.red, sw: 1.5, dash: '4 3' });
    points.push({ x: r.sold, y: o.P, color: PAL.ink, r: 6, label: `you: ${fmt(r.sold, 1)} units at $${fmt(o.P, 0)}`, dy: -11, anchor: 'middle', dx: 0 });
    if (r.lost > 0.05) vlines.push({ x: r.qd, color: PAL.red, label: `${fmt(r.lost, 1)} customers turned away` });
  }
  return {
    w, h: Math.round(Math.min(580, Math.max(360, w * 0.66))),
    x: [0, qMax], y: [0, yMax],
    xLabel: 'Your output q (units per period)', yLabel: 'Price / cost ($)',
    series: [
      { pts: filter(dem), color: PAL.green, width: 2.8, label: 'D = AR', area: .08 },
      { pts: filter(mr), color: PAL.violet, width: 2.4, label: 'MR', dash: '6 4' },
      { pts: filter(mc), color: PAL.red, width: 2.8, label: 'MC', labelDy: -10 },
      { pts: filter(ac), color: PAL.blue, width: 2.8, label: 'AC' }
    ],
    shapes, points, vlines, hlines
  };
}
VIEWS['dec-mc-chart'] = w => {
  const adLv = AD_LEVELS[S.dec.ad] || AD_LEVELS[0];
  const r = mcFirm(S.dec.K, S.dec.P, (S.dec.mult || 1) * adLv.mult, adLv.spend, S.dec.L);
  return chart(cfgMCFirm(w, { K: S.dec.K, mult: (S.dec.mult || 1) * adLv.mult, P: S.dec.P, res: r, showProfit: true }));
};

function pcStreet(n, closed) {
  const cells = [];
  for (let i = 0; i < n; i++) {
    cells.push({ label: i === 1 ? (S.firmName || 'You') : streetName(i), sub: i === 1 ? 'you' : 'rival', mine: i === 1, closed: closed && closed.indexOf(i) >= 0 });
  }
  return artStreet(prod(), S.colour, cells, { heading: `${n} ${sellers()} on the same street, all selling an identical ${prod().unit}` });
}

const OLIGO_H = 44, OLIGO_L = 30;
const OLIGO_PAY = {
  HH: 530, HL: -125, LH: 615, LL: 250
};
function oligoPay(me, riv) { return OLIGO_PAY[me + riv]; }
function rivalMove() {
  const o = S.oligo, r = o.mine.length;
  if (r === 0) return 'H';
  const myLast = o.mine[r - 1];
  if (o.reported && r >= 1) return Math.random() < 0.45 ? 'L' : 'H';
  if (o.collude) return Math.random() < 0.9 ? 'H' : 'L';
  if (myLast === 'L') return Math.random() < 0.8 ? 'L' : 'H';
  const rivLast = o.rival[r - 1];
  if (rivLast === 'L') return Math.random() < 0.35 ? 'L' : 'H';
  return Math.random() < 0.9 ? 'H' : 'L';
}
function oligoMatrix(o) {
  const me = o.lastMe, riv = o.lastRiv;

function lockOligo(b) {
  const o = S.oligo;
  const me = S.dec.choice || 'H';
  const riv = b.forceHigh ? 'H' : rivalMove();

  o.lastMe = me; o.lastRiv = riv; o.lastRivPay = rivPay;
  logRun('oligo', `Round ${o.mine.length}`, pay);
  addValue(pay);
}

/* ============================================================
   CHAPTER 4 — MONOPOLY
   ============================================================ */
function socialOpt(K) {
  let bestQ = null, bestGap = Infinity;
  for (let q = 1; q <= ECON.capacity(K) * 0.985; q += 0.25) {
    const L = ECON.labourFor(K, q);
    if (!isFinite(L)) continue;
    const gap = Math.abs(ECON.mc(K, L) - ECON.marketP(q));
    if (gap < bestGap) { bestGap = gap; bestQ = { q, L, mc: ECON.mc(K, L), pd: ECON.marketP(q) }; }
  }
  return bestQ;
}
function monoState(K, P) {
  const Q = ECON.marketQ(P);
  const L = ECON.labourFor(K, Q);
  const feasible = Q > 0 && isFinite(L);
  if (!feasible) return { Q, L: Infinity, feasible: false, profit: -Infinity };
  const tc = ECON.tc(K, L);
  return { Q, L, tc, ac: tc / Q, mc: ECON.mc(K, L), tr: P * Q, profit: P * Q - tc, feasible: true, mr: ECON.mrFromQ(Q) };
}
function dwlArea(K, Qm, Pm, MCm) {
  const so = socialOpt(K);
  if (!so || so.q <= Qm) return { area: 0, so };
  const A = [Qm, Pm], B = [Qm, MCm], C = [so.q, so.mc];
  const area = 0.5 * Math.abs(A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
  return { area, so };
}
function cfgMonopoly(w, o) {
  const K = o.K, P = o.P;
  const m = monoState(K, P);
  const yMax = 72;
  const dem = [], mr = [], mc = [], ac = [];
  for (let q = 0; q <= 300; q += 2) { dem.push([q, ECON.marketP(q)]); mr.push([q, ECON.mrFromQ(q)]); }
  /* only the rising branch of total product: past its peak the same output would
     need FEWER workers, so a cost curve drawn there would double back on itself */
  for (let l = 0.25; l <= K * ECON.X_TPP; l += 0.25) {
    const q = ECON.output(K, l);
    const mcv = ECON.mc(K, l);
    if (q <= 0) continue;
    if (mcv <= yMax) mc.push([q, mcv]);
    const acv = ECON.ac(K, l);
    if (acv <= yMax) ac.push([q, acv]);
  }
  const ser = [
    { pts: dem.filter(p => p[1] >= 0), color: PAL.green, width: 3, label: 'D = market demand', area: .07 },
    { pts: mr.filter(p => p[1] >= 0), color: PAL.violet, width: 2.4, label: 'MR', dash: '6 4' },
    { pts: mc.filter(p => p[1] <= yMax), color: PAL.red, width: 3, label: 'MC', labelDy: 13 },
    { pts: ac.filter(p => p[1] <= yMax), color: PAL.blue, width: 3, label: 'AC' }
  ];
  const shapes = [], points = [], vlines = [];
  if (m.feasible && m.Q > 0) {
    shapes.push({ type: 'rect', x0: 0, y0: Math.max(m.ac, P), x1: m.Q, y1: Math.min(m.ac, P), fill: PAL.green, opacity: .18, stroke: PAL.green, sw: 1.6, dash: '4 3' });
    points.push({ x: m.Q, y: P, color: PAL.ink, r: 6.5, label: `you: ${fmt(m.Q, 0)} units at $${fmt(P, 0)}`, dy: -12, anchor: 'middle', dx: 0 });
    vlines.push({ x: m.Q, color: PAL.guide, label: `Q = ${fmt(m.Q, 0)}` });
    points.push({ x: m.Q / 2, y: (m.ac + P) / 2, color: PAL.green, r: 0, label: 'profit', anchor: 'middle', dx: 0 });
    if (o.welfare) {
      const d = dwlArea(K, m.Q, P, m.mc);
      if (d.area > 1) {
        shapes.push({ type: 'poly', pts: [[m.Q, P], [m.Q, m.mc], [d.so.q, d.so.mc]], fill: PAL.red, opacity: .26, stroke: PAL.red, sw: 1.6 });
        points.push({ x: m.Q + (d.so.q - m.Q) * 0.3, y: (m.mc + P) / 2 - 20, color: PAL.red, r: 0, label: 'value destroyed', anchor: 'middle', dx: 0 });
        vlines.push({ x: d.so.q, color: PAL.red, label: 'where D = MC' });
      } else {
        vlines.push({ x: d.so.q, color: PAL.red, label: 'where D = MC' });
      }
    }
  }
  return {
    w, h: Math.round(Math.min(580, Math.max(360, w * 0.62))),
    x: [0, 300], y: [0, yMax],
    xLabel: 'Market output Q (units per period)', yLabel: 'Price / cost ($)',
    series: ser, shapes, points, vlines
  };
}

/* ---- the input market, when the firm is the town's only employer ---- */
function cfgMonopsony(w, o) {
  const K = o.K, W = o.W;
  const xMax = 26, yMax = 210;
  const r = ECON.buyerState(K, W);
  const comp = ECON.competitiveWage(K);

  const supply = [], mfc = [], mrp = [];
  for (let L = 0; L <= xMax; L += 0.5) {
    if (ECON.supplyWage(L) <= yMax) supply.push([L, ECON.supplyWage(L)]);
    if (ECON.mfc(L) <= yMax) mfc.push([L, ECON.mfc(L)]);
    if (L >= 0.5) { const m = ECON.mrp(K, L); if (m > 0 && m <= yMax) mrp.push([L, m]); }
  }

  const shapes = [], points = [], vlines = [], hlines = [];

  /* the value the town never gets: between the monopsony employment and the
     competitive one, each worker is worth more than they would have to be paid */
  if (o.welfare !== false && comp && comp.L > r.L + 0.4) {
    const pts = [], n = 8, clip = v => Math.min(yMax, Math.max(0, v));
    for (let i = 0; i <= n; i++) { const L = r.L + i * (comp.L - r.L) / n; pts.push([L, clip(ECON.mrp(K, L))]); }
    for (let i = n; i >= 0; i--) { const L = r.L + i * (comp.L - r.L) / n; pts.push([L, ECON.supplyWage(L)]); }
    shapes.push({ type: 'poly', pts, fill: PAL.red, opacity: .17, stroke: PAL.red, sw: 1.4, dash: '4 3' });
    points.push({ x: (r.L + comp.L) / 2, y: ECON.supplyWage(r.L) + 22, color: PAL.red, r: 0, label: 'value never created', anchor: 'middle', dx: 0 });
  }

  /* the wedge the firm keeps, drawn as a slim bar at its chosen employment.
     When the wage is already close to what a worker adds there is nothing to
     show and no room for a second label, so both are skipped. */
  const bigGap = (r.mrp - W) > 22;
  if (r.L > 0.3 && bigGap) {
    shapes.push({ type: 'poly', pts: [[r.L - 0.13, W], [r.L + 0.13, W], [r.L + 0.13, r.mrp], [r.L - 0.13, r.mrp]], fill: PAL.red, opacity: .55 });
  }

  points.push({ x: r.L, y: W, color: PAL.ink, r: 6.5, label: `you: ${fmt(r.L, 1)} workers at $${fmt(W, 0)}`, dy: -13, anchor: 'middle', dx: 0 });
  if (r.L > 0.3 && bigGap) points.push({ x: r.L, y: r.mrp, color: PAL.red, r: 5, label: `each adds $${fmt(r.mrp, 0)}`, dy: -11, anchor: 'middle', dx: 0 });
  if (comp) points.push({ x: comp.L, y: comp.W, color: PAL.green, r: 5 });

  hlines.push({ y: W, color: PAL.ink, dash: '6 4', label: `your wage $${fmt(W, 0)}`, labelSide: 'left' });
  vlines.push({ x: r.L, color: PAL.guide });
  if (comp && Math.abs(comp.L - r.L) > 1) vlines.push({ x: comp.L, color: PAL.green, label: 'competitive employment' });

  return {
    w, h: Math.round(Math.min(580, Math.max(360, w * 0.62))),
    x: [0, xMax], y: [0, yMax],
    xLabel: 'Workers employed', yLabel: 'Wage / value per worker ($)',
    series: [
      { pts: supply, color: PAL.green, width: 3, label: 'Labour supply' },
      { pts: mfc, color: PAL.violet, width: 2.6, label: 'MFC', dash: '6 4' },
      { pts: mrp, color: PAL.red, width: 3, label: 'MRP = what a worker adds' }
    ],
    shapes, points, vlines, hlines
  };
}

function decMono(b) {
  const K = S.dec.monoK, P = S.dec.P;
  const pMin = b.stage2 ? 28 : 36, pMax = b.stage2 ? 48 : 56;
  const m = monoState(K, P);
  if (S.locked) {
    const d = m.feasible ? dwlArea(K, m.Q, P, m.mc) : { area: 0 };
    const transfer = m.feasible ? (P - m.ac) * m.Q : 0;
    let bestP = P, bestProfit = -Infinity;
    for (let p = pMin; p <= pMax; p += 0.5) {
      const rr = monoState(K, p);
      if (rr.feasible && rr.profit > bestProfit) { bestProfit = rr.profit; bestP = p; }
    }
    return `
    <div class="card event good fade">
      <div class="kicker">Result</div>
      <h2>Only one firm in this market \u2014 you</h2>
      <div class="tiles">
        <div class="tile"><div class="tl">Your price</div><div class="tv">$${fmt(P, 0)}</div><div class="ts">you set it</div></div>
        <div class="tile hi"><div class="tl">Output</div><div class="tv">${fmt(m.Q, 0)}</div><div class="ts">units sold</div></div>
        <div class="tile"><div class="tl">Revenue</div><div class="tv">${money(m.tr)}</div><div class="ts">TR</div></div>
        <div class="tile"><div class="tl">Costs</div><div class="tv">${money(m.tc)}</div><div class="ts">AC = ${money(m.ac, 2)}</div></div>
        <div class="tile pos"><div class="tl">Economic profit</div><div class="tv">${money(m.profit)}</div><div class="ts">added to firm value</div></div>
      </div>
      <div class="chartcard" data-view="dec-mono-chart"></div>
      ${b.after(m, bestP, transfer, d)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }
  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">Your price</span><span class="v" id="ctlP">$${fmt(P, 0)}</span></div>
      ${sliderRow('dec-mp', pMin, pMax, 0.5, P, `<div class="ticks"><span>$${pMin}</span><span>$${(pMin + pMax) / 2}</span><span>$${pMax}</span></div>`)}
      <div class="small muted" style="margin-top:.25rem">Your plant has ${K} ${K > 1 ? caps() : cap()} \u2014 the most it can physically make is about ${fmt(ECON.capacity(K), 0)} units a period.${b.stage2 ? ' The regulator will accept any price at or below $30.' : ''}</div>
    </div>
    ${b.stage2 ? `<div class="ctl">
      <div class="clab"><span class="t">${Caps()} (capital)</span><span class="v">${K}</span></div>
      <div class="optrow">${[3, 4, 5].map(k => `<button class="opt ${K === k ? 'sel' : ''}" data-a="dec-mk" data-v="${k}">${k} ${caps()}<small>${money(ECON.MACHINE * k)} / period</small></button>`).join('')}</div>
    </div>` : ''}
    <div class="ctl">
      <div class="clab"><span class="t">Show what society loses</span></div>
      <div class="optrow"><button class="opt ${S.dec.welfare ? 'sel' : ''}" data-a="dec-welfare">${S.dec.welfare ? 'Shown on the chart' : 'Hidden'}</button></div>
    </div>`;
  /* the numbers ride along with the sliders, pinned to the top of the screen, so
     the demand curve below can be watched while the price is dragged */
  const out = `
    <div class="readout">
      <div class="ro hi"><div class="rl">Price</div><div class="rv">$${fmt(P, 2)}</div></div>
      <div class="ro"><div class="rl">Quantity demanded</div><div class="rv">${m.feasible ? fmt(m.Q, 0) : '\u2014'}</div></div>
      <div class="ro"><div class="rl">Marginal revenue</div><div class="rv">${m.feasible ? money(m.mr, 2) : '\u2014'}</div></div>
      <div class="ro ${m.feasible && Math.abs(m.mr - m.mc) < 2 ? 'pos' : ''}"><div class="rl">Marginal cost</div><div class="rv">${m.feasible ? money(m.mc, 2) : '\u2014'}</div></div>
      <div class="ro"><div class="rl">Average cost</div><div class="rv">${m.feasible ? money(m.ac, 2) : '\u2014'}</div></div>
      <div class="ro ${m.feasible ? (m.profit >= 0 ? 'pos' : 'neg') : ''}"><div class="rl">Economic profit</div><div class="rv">${m.feasible ? money(m.profit) : '\u2014'}</div></div>
    </div>
    <div class="small muted" style="margin-top:.35rem">${!m.feasible ? 'At this price the town would not buy anything, so there is nothing to make.' : (m.mr > m.mc + 1.5 ? 'Marginal revenue is <b>above</b> marginal cost \u2014 one more unit would add more revenue than it costs.' : (m.mc > m.mr + 1.5 ? 'Marginal revenue is <b>below</b> marginal cost \u2014 one fewer unit would cost you less than it loses.' : 'Marginal revenue and marginal cost are level \u2014 this is the profit-maximising output.'))}</div>`;
  const foot = `
    <div class="card tight" data-note="flat">
      <div class="small" style="font-weight:800">Your market position</div>
      <div class="scoreline"><span>Other firms producing in town</span><b>none</b></div>
      <div class="scoreline"><span>Barriers to entry</span><b>very high</b></div>
      <div class="scoreline"><span>Can you choose the price?</span><b style="color:var(--brand-d)">Yes \u2014 completely</b></div>
      <div class="scoreline" style="border:none"><span>Demand curve you face</span><b>the whole market</b></div>
      <div class="small muted" style="margin-top:.4rem">With no rivals, the market demand curve <i>is</i> your demand curve. You sell more only by charging less \u2014 so marginal revenue falls below price.</div>
    </div>
    <div class="btnrow"><button class="btn primary wide big" data-a="dec-lock" ${m.feasible ? '' : 'disabled'}>Lock in the decision</button></div>`;
  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-mono-chart"></div>`, foot, true);
}
ACTS['dec-mp'] = t => { S.dec.P = +t.value; res(); };
ACTS['dec-mk'] = t => { S.dec.monoK = +t.dataset.v; res(); };
VIEWS['dec-mono-chart'] = w => chart(cfgMonopoly(w, { K: S.dec.monoK, P: S.dec.P, welfare: S.dec.welfare }));

function lockMono(b) {
  const m = monoState(S.dec.monoK, S.dec.P);
  const profit = m.feasible ? m.profit : -ECON.tfc(S.dec.monoK);
  if (!b.stage2) {
    let best = -Infinity, bp = 0;
    for (let p = 36; p <= 56; p += 0.5) { const r = monoState(S.dec.monoK, p); if (r.feasible && r.profit > best) { best = r.profit; bp = p; } }
    if (Math.abs(S.dec.P - bp) <= 1) S.insight += 10;
  }
  logRun('mono', `${b.label || 'Monopoly pricing'} \u2014 price $${fmt(S.dec.P, 0)}`, profit);
  addValue(profit);
}

/* ---------------- the monopsony decision ----------------
   The firm names a wage; the town's labour supply decides how many people turn
   up. One slider, and everything downstream — employment, output, the price the
   firm can charge, its profit and the town's wage bill — follows from it. */
function decBuyer(b) {
  const K = S.dec.buyK, W = S.dec.W;
  const r = ECON.buyerState(K, W);
  const oldR = ECON.buyerState(K, ECON.WAGE);
  const comp = ECON.competitiveWage(K);

  if (S.locked) {
    const dwl = ECON.monopsonyDWL(K);
    const bill = W * r.L, oldBill = oldR.W * oldR.L;
    const gain = r.profit - oldR.profit;
    return `
    <div class="card event ${gain >= 0 ? 'good' : 'bad'} fade">
      <div class="kicker">Result</div>
      <h2>You are the town\u2019s only employer</h2>
      <div class="tiles">
        <div class="tile hi"><div class="tl">Wage you offer</div><div class="tv">$${fmt(W, 0)}</div><div class="ts">${W < ECON.WAGE ? money(ECON.WAGE - W, 0) + ' below the old wage' : W > ECON.WAGE ? money(W - ECON.WAGE, 0) + ' above the old wage' : 'the old market wage'}</div></div>
        <div class="tile"><div class="tl">People who will work</div><div class="tv">${fmt(r.L, 1)}</div><div class="ts">at $${fmt(W, 0)} an hour</div></div>
        <div class="tile"><div class="tl">Output</div><div class="tv">${fmt(r.Q, 0)}</div><div class="ts">sold at $${fmt(r.P, 2)}</div></div>
        <div class="tile"><div class="tl">Pay going into the town</div><div class="tv">${money(bill)}</div><div class="ts">${bill <= oldBill ? money(oldBill - bill, 0) + ' less than at $90' : money(bill - oldBill, 0) + ' more than at $90'}</div></div>
        <div class="tile ${gain >= 0 ? 'pos' : 'neg'}"><div class="tl">Economic profit</div><div class="tv">${money(r.profit)}</div><div class="ts">${gain >= 0 ? '+' : ''}${money(gain, 0)} against $90</div></div>
      </div>
      <div class="chartcard" data-view="dec-buyer-chart"></div>
      ${b.after(r, ECON.bestWage(K), comp, dwl, oldR)}
      <div class="btnrow right"><button class="btn primary big" data-a="next">Continue \u2192</button></div>
    </div>`;
  }

  const ctl = `
    <div class="ctl" style="margin-top:0">
      <div class="clab"><span class="t">The wage you offer</span><span class="v" id="ctlW">$${fmt(W, 2)}</span></div>
      ${sliderRow('dec-wage', 45, 115, 0.5, W, '<div class="ticks"><span>$45</span><span>$80</span><span>$115</span></div>')}
      <div class="small muted" style="margin-top:.25rem">You are the only employer here, so the wage is yours to set. Offer less and fewer people will take the job \u2014 there is nowhere else for them to go.</div>
    </div>
    <div class="ctl">
      <div class="clab"><span class="t">Show what the town loses</span></div>
      <div class="optrow"><button class="opt ${S.dec.welfare ? 'sel' : ''}" data-a="dec-welfare">${S.dec.welfare ? 'Shown on the chart' : 'Hidden'}</button></div>
    </div>`;

  /* pinned with the slider, so the labour-supply diagram stays in view */
  const out = `
    <div class="readout">
      <div class="ro hi"><div class="rl">Wage you offer</div><div class="rv">$${fmt(W, 2)}</div></div>
      <div class="ro"><div class="rl">Workers employed</div><div class="rv">${fmt(r.L, 2)}</div></div>
      <div class="ro"><div class="rl">Output</div><div class="rv">${fmt(r.Q, 1)}</div></div>
      <div class="ro"><div class="rl">Price you can charge</div><div class="rv">$${fmt(r.P, 2)}</div></div>
      <div class="ro"><div class="rl">Marginal factor cost</div><div class="rv">${money(r.mfc, 2)}</div></div>
      <div class="ro"><div class="rl">What a worker adds</div><div class="rv">${money(r.mrp, 2)}</div></div>
      <div class="ro ${r.profit >= oldR.profit ? 'pos' : 'neg'}"><div class="rl">Economic profit</div><div class="rv">${money(r.profit)}</div></div>
    </div>`;

  const foot = `
    <div class="card tight" data-note="flat">
      <div class="small" style="font-weight:800">Your position as a buyer</div>
      <div class="scoreline"><span>Employers in this town</span><b>one \u2014 you</b></div>
      <div class="scoreline"><span>Hiring one more worker costs</span><b>${money(r.mfc, 2)}</b></div>
      <div class="scoreline"><span>...and that worker adds</span><b>${money(r.mrp, 2)}</b></div>
      <div class="scoreline" style="border:none"><span>You keep the difference</span><b class="${r.mrp - W > 0 ? 'good' : 'bad'}">${money(Math.max(0, r.mrp - W), 2)} per worker</b></div>
      <div class="small muted" style="margin-top:.4rem">Taking on one more person means paying everyone you already employ a little more, so the <i>marginal factor cost</i> (purple) sits above the wage the workers actually receive (black). You hire where that marginal cost meets what a worker adds, then pay the lowest wage the supply curve will accept at that number of workers.</div>
    </div>
    <div class="btnrow"><button class="btn primary wide big" data-a="dec-lock">Lock in the wage</button></div>`;

  return decShell(b, ctl, out, `<div class="chartcard" data-view="dec-buyer-chart"></div>`, foot, true);
}
ACTS['dec-wage'] = t => { S.dec.W = +t.value; res(); };
VIEWS['dec-buyer-chart'] = w => chart(cfgMonopsony(w, { K: S.dec.buyK, W: S.dec.W, welfare: S.dec.welfare }));

function lockBuyer(b) {
  const r = ECON.buyerState(S.dec.buyK, S.dec.W);
  const best = ECON.bestWage(S.dec.buyK);
  if (Math.abs(S.dec.W - best.W) <= 2.5) S.insight += 10;
  logRun('mono', `${b.label || 'Monopsony'} \u2014 wage $${fmt(S.dec.W, 0)}`, r.profit);
  addValue(r.profit);
}

/* ============================================================
   MARKET FORCES — THE TASK SYSTEM
   ------------------------------------------------------------
   One registry decides three things that used to disagree:
     1. what the student is being asked to do in this section
     2. whether the section may be left (the exit gate)
     3. what the side rail shows
   If a task is not in here, it cannot block progress; if it is in
   here, it always blocks progress. There is no second rulebook.
   ============================================================ */

/* ---- helpers: the "correct answers" the lab tasks are chasing ---- */
function labPeerL(kind) {
  const K = S.lab.K;
  const low = kind === 'ac' || kind === 'avc';
  let best = 1, v = low ? Infinity : -Infinity;
  const top = ECON.maxL(K);
  for (let l = 1; l <= top; l++) {
    const y = kind === 'mp' ? ECON.mp(K, l)
      : kind === 'ap' ? ECON.ap(K, l)
        : kind === 'ac' ? ECON.ac(K, l) : ECON.avc(K, l);
    if (low ? y < v : y > v) { v = y; best = l; }
  }
  return best;
}

/* ---- the lab's seven tasks. Every one of them is required. ---- */
const LAB_TASKS = [
  {
    id: 'p_mp', group: 'production', reward: 10,
    label: 'Set workers so that <b>marginal product is at its maximum</b>.',
    hint: 'Watch the MP column as you add workers — it rises, turns, then falls.',
    met: () => S.lab.L === labPeerL('mp'),
    why: () => `Marginal product peaks at worker ${labPeerL('mp')}: one more worker adds more output than any other hire does.`
  },
  {
    id: 'p_ap', group: 'production', reward: 10,
    label: 'Set workers so that <b>average product is at its maximum</b>.',
    hint: 'That is exactly where AP = MP.',
    met: () => S.lab.L === labPeerL('ap'),
    why: () => `Average product peaks at worker ${labPeerL('ap')} — the point where the marginal worker is exactly as productive as the average.`
  },
  {
    id: 'c_minac', group: 'costs', reward: 10,
    label: 'Set workers to the level that <b>minimises average total cost</b>.',
    hint: 'Follow the AC column down, then up again.',
    met: () => S.lab.L === labPeerL('ac'),
    why: () => `Average cost bottoms out at worker ${labPeerL('ac')}. Either side of it, a unit costs more to make.`
  },
  {
    id: 'c_shut', group: 'costs', reward: 10,
    label: 'Set workers to the level that <b>minimises average variable cost</b>.',
    hint: 'The AC curve is still falling here — that is the AFC at work.',
    met: () => S.lab.L === labPeerL('avc'),
    why: () => `Average variable cost bottoms out at worker ${labPeerL('avc')}. Below that price there is nothing left to gain by producing, so this is the shutdown price.`
  },
  {
    id: 'f_p40', group: 'profit', reward: 10,
    label: 'The market price is <b>$40</b>. Find the crew that earns the most profit.',
    hint: 'Watch the profit figure as you hire one worker at a time.',
    met: () => labTaskNow() === 'f_p40' && S.lab.L === ECON.bestL(S.lab.K, 40).L,
    why: () => `At $40 the best crew is ${ECON.bestL(S.lab.K, 40).L}, turning out ${fmt(ECON.output(S.lab.K, ECON.bestL(S.lab.K, 40).L), 1)} units — the point where marginal cost is just about $40.`
  },
  {
    id: 'f_p24', group: 'profit', reward: 10,
    label: 'The market price is <b>$24</b>. Produce anyway, or stop?',
    hint: 'Compare $24 with the minimum average variable cost you found in the cost tab.',
    met: () => labTaskNow() === 'f_p24' && S.lab.L === ECON.bestL(S.lab.K, 24).L && ECON.bestL(S.lab.K, 24).L > 0,
    why: () => `At $24 the price still covers variable cost, so carrying on is the smaller loss — and ${ECON.bestL(S.lab.K, 24).L} workers is the crew that keeps that loss lowest.`
  },
  {
    id: 'f_p16', group: 'profit', reward: 10,
    label: 'The market price is <b>$16</b>. What is the right decision now?',
    hint: 'Compare what you lose by producing with what you lose by stopping.',
    met: () => labTaskNow() === 'f_p16' && S.lab.L === 0,
    why: () => 'At $16 the price is below minimum average variable cost. Every unit adds to the loss, so shut down and lose only the fixed cost.'
  }
].map(t => Object.assign(t, {
  /* "ok" is the banked result: the student has confirmed it with Check my answers */
  ok: () => !!S.lab.missions[t.id],
  required: true
}));

/* ---- the tasks attached to whatever chapter beat is on screen ---- */
function beatTasks() {
  const b = curBeat();
  if (!b) return [];
  const id = 'beat:' + (S.chs[S.chIdx] || 'pc') + ':' + S.beat;
  const mk = (label, hint, done) => [{ id, label, hint, ok: done, met: done, required: true, reward: 0 }];
  if (b.t === 'decision') {
    return mk(b.taskLabel || 'Lock in your decision.',
      b.taskHint || 'Move the sliders until the numbers look right, then lock it in.',
      () => S.locked);
  }
  if (b.t === 'check') {
    return mk('Answer the question.',
      'There is a right answer — and a reason for it.', () => S.checkAns != null);
  }
  if (b.t === 'intro') {
    const chs = typeof b.choices === 'function' ? b.choices() : b.choices;
    if (chs && chs.length) {
      return mk('Choose how your firm will respond.',
        'Pick one of the options to carry on.', () => S.pick != null);
    }
  }
  return [];
}

/* ---- the section: what the rail is looking at right now ---- */
function sectionKey() {
  if (S.scene === 'lab') return 'lab:' + S.lab.tab;
  if (S.scene === 'chapter') return 'ch:' + (S.chs[S.chIdx] || 'pc') + ':' + S.beat;
  return S.scene;
}
function sectionTasks() {
  if (S.scene === 'lab') return LAB_TASKS.filter(t => t.group === S.lab.tab);
  if (S.scene === 'chapter') return beatTasks();
  return [];
}
/* everything that must be finished before this section can be left.
   For the lab that is every task in the factory, not just the tab you happen to be on. */
function gateTasks() {
  if (S.scene === 'lab') return LAB_TASKS;
  if (S.scene === 'chapter') return beatTasks();
  return [];
}
function gateMissing() { return gateTasks().filter(t => t.required && !t.ok()); }
function gateOpen() { return gateMissing().length > 0; }
function gateMessage() {
  const m = gateMissing();
  if (!m.length) return '';
  if (S.scene === 'lab') {
    const other = m.filter(t => t.group !== S.lab.tab);
    const here = m.filter(t => t.group === S.lab.tab);
    if (!here.length && other.length) return `Still open: ${other.length} task${other.length > 1 ? 's' : ''} in the other tabs of the factory.`;
  }
  return `Not finished yet: ${m[0].label.replace(/<[^>]+>/g, '')}`;
}

/* ============================================================
   THE PANEL ITSELF
   A floating gold card. Collapsed it is a badge in the corner; expanded it sits
   over the middle of the screen. It is never part of the page grid, so opening
   or closing it cannot change the width of anything the student is reading.
   ============================================================ */
function taskCount(tasks) { return { done: tasks.filter(t => t.ok()).length, total: tasks.length }; }

function taskStateOf(t) {
  if (t.ok()) return 'ok';
  if (t.met && t.met()) return 'armed';
  return 'open';
}

function taskItemHTML(t, i) {
  const state = taskStateOf(t);
  let hint = t.hint;
  if (state === 'armed') hint = 'Looks right \u2014 press <b>Check my answers</b> to bank it.';
  else if (state === 'ok' && t.why) hint = t.why();
  const tag = state === 'ok' ? '<span class="tp-tag ok">banked</span>'
    : state === 'armed' ? '<span class="tp-tag armed">ready to bank</span>'
      : (t.reward ? `<span class="tp-tag open">+${t.reward} Insight</span>` : '');
  return `<div class="tp-item ${state}">
    <span class="tp-num">${state === 'ok' ? '\u2713' : i + 1}</span>
    <div class="tp-body"><div class="tp-lab">${t.label}${tag}</div>${hint ? `<div class="tp-hint">${hint}</div>` : ''}</div>
  </div>`;
}

function taskBody() {
  if (S.scene === 'lab') {
    const cur = S.lab.tab;
    const mine = LAB_TASKS.filter(t => t.group === cur);
    const c = taskCount(mine), all = taskCount(LAB_TASKS);
    const groups = Object.keys(LABTABS).map(g => {
      const cc = taskCount(LAB_TASKS.filter(t => t.group === g));
      return { g, label: LABTABS[g].label.replace(/^\d+ \u00b7 /, ''), ...cc, done: cc.done === cc.total, here: g === cur };
    });
    return {
      open: c.done, total: c.total,
      allDone: all.done === all.total,
      kick: 'The Factory \u00b7 ' + LABTABS[cur].label.replace(/^\d+ \u00b7 /, ''),
      items: mine.map(taskItemHTML).join(''),
      groups,
      notebook: {
        label: LABTABS[cur].label.replace(/^\d+ \u00b7 /, ''),
        known: labNotebookCount(S.lab.K),
        total: ECON.maxL(S.lab.K) + 1
      },
      groupNote: all.done === all.total
        ? 'Every task in the factory is done \u2014 the gate is open.'
        : `The gate opens once all ${all.total} factory tasks are done. ${all.total - all.done} still to go.`,
      note: c.done === c.total ? 'This tab is finished.' : 'Find these, then press Check my answers to bank them.',
      jump: c.done === c.total ? null : 'Jump to the next unfinished tab'
    };
  }
  const tasks = sectionTasks();
  if (!tasks.length) {
    if (S.scene !== 'chapter') return null;
    return {
      open: 0, total: 0, allDone: true,
      kick: 'This step',
      items: '<div class="tp-item"><div class="tp-body"><div class="tp-hint">Nothing to decide here \u2014 read on, then continue.</div></div></div>',
      note: '', jump: null, groups: null
    };
  }
  const c = taskCount(tasks);
  return {
    open: c.done, total: c.total,
    allDone: c.done === c.total,
    kick: S.scene === 'chapter' ? 'This step' : 'Tasks',
    items: tasks.map(taskItemHTML).join(''),
    groups: null,
    note: c.done === c.total ? 'Step complete \u2014 carry on.' : 'Finish this and the Continue button will let you through.',
    jump: null
  };
}

/* a small progress ring for the floating badge */
function ringSVG(done, total, size) {
  const R = 13, C = 2 * Math.PI * R;
  const frac = total ? Math.min(1, done / total) : 1;
  const col = total === 0 ? '#94A3B8' : (done === total ? '#0B825F' : '#8A6100');
  return `<svg class="tf-ring" width="${size}" height="${size}" viewBox="0 0 34 34" aria-hidden="true">
    <circle cx="17" cy="17" r="${R}" fill="none" stroke="rgba(74,50,0,.18)" stroke-width="4"/>
    <circle cx="17" cy="17" r="${R}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 17 17)"/>
    <text x="17" y="21" text-anchor="middle" font-size="12" font-weight="800" fill="${col}">${total ? done : '\u2014'}</text>
  </svg>`;
}

function taskFabHTML(m) {
  const quiet = m.total === 0 || m.allDone;
  const label = m.total === 0 ? 'Nothing to do' : (m.allDone ? 'All done' : `${m.open} of ${m.total} done`);
  return `${ringSVG(m.open, m.total, 30)}
    <span class="tf-txt"><b>Tasks</b><small>${label}</small></span>`;
}

function taskPanelHTML(m) {
  const pct = m.total ? Math.round(m.open / m.total * 100) : 100;
  const bk = m.notebook;
  const book = bk ? `
    <div class="tp-book">
      <div class="tbrow"><span>Your notebook \u00b7 ${bk.label}</span><b>${bk.known} / ${bk.total}</b></div>
      <div class="tp-bar"><i style="width:${Math.round(bk.known / bk.total * 100)}%"></i></div>
      <div class="tbnote">${bk.known >= bk.total
      ? '\u2713 Every crew size tested \u2014 the whole curve is on the charts.'
      : 'A row only fills in once you have actually stopped on that crew size. Drag the slider (or use the + / \u2212 buttons) and let go.'}</div>
      ${bk.known >= bk.total ? '' : '<div class="btnrow" style="margin-top:.55rem"><button class="btn wide" data-a="lab-reveal">Reveal the whole table</button></div>'}
    </div>` : '';
  const groups = m.groups ? `
    <div class="tp-groups">
      ${m.groups.map(g => `<div class="tp-group${g.done ? ' done' : ''}">
        <span class="tp-gn">${g.label}${g.here ? ' <span class="tp-tag open">you are here</span>' : ''}</span>
        <span class="tp-gp">${g.done ? '\u2713 ' : ''}${g.done}/${g.total}</span></div>`).join('')}
      <div class="tp-hint" style="margin-top:.4rem">${m.groupNote}</div>
    </div>` : '';
  return `
    <div class="tp-head">
      <span class="tp-crest">${uicon("trophy")}</span>
      <div class="tp-title">
        <div class="tp-kick">Tasks \u00b7 ${m.kick}</div>
        <h3>${m.total ? `${m.open} of ${m.total} done` : 'Nothing to decide here'}</h3>
      </div>
      <button class="tp-close" data-a="task-close" title="Close (Esc)">\u2715</button>
    </div>
    <div class="tp-bar"><i style="width:${pct}%"></i></div>
    <div class="tp-barlab"><span>${m.allDone ? 'Complete' : 'In progress'}</span><span>${pct}%</span></div>
    ${book}
    <div class="tp-list">${m.items}</div>
    ${groups}
    <div class="tp-foot">
      <div class="tp-note">${m.note}</div>
      ${m.jump ? `<button class="btn primary" data-a="task-jump">${m.jump} \u2192</button>` : ''}
    </div>`;
}

/* ---- sync: called after every render, and after every live lab update ---- */
function taskSync() {
  const fab = q('#taskfab'), ov = q('#taskoverlay'), panel = q('#taskpanel');
  if (!fab || !ov || !panel) return;
  const m = taskBody();

  if (!m) {
    fab.className = 'taskfab hide';
    ov.className = 'taskoverlay';
    S.task.key = '';
    return;
  }

  const key = sectionKey();
  if (S.task.key !== key) {
    S.task.key = key;
    const firstTime = !S.task.seen[key];
    S.task.seen[key] = 1;
    /* open it the first time a section is met so the tasks actually get read;
       never re-open it on a section the student has already seen */
    S.task.open = (m.total > 0 && firstTime);
  }

  fab.className = 'taskfab' + ((m.total === 0 || m.allDone) ? ' quiet' : '');
  fab.setAttribute('data-total', String(m.total));
  ov.className = 'taskoverlay' + (S.task.open ? ' show' : '');
  fab.setAttribute('aria-expanded', S.task.open ? 'true' : 'false');
  /* only touch the DOM when something really changed, so the badge never
     flickers while a slider is being dragged */
  const fabFresh = taskFabHTML(m);
  if (fab.innerHTML !== fabFresh) fab.innerHTML = fabFresh;
  const panelFresh = taskPanelHTML(m);
  if (panel.innerHTML !== panelFresh) panel.innerHTML = panelFresh;
}

function openTasks(force) { S.task.open = force == null ? true : force; taskSync(); }

ACTS['task-open'] = () => openTasks(true);
ACTS['task-close'] = () => openTasks(false);
ACTS['task-scrim'] = (t, e) => { if (e && e.target === t) openTasks(false); };
ACTS['task-jump'] = () => {
  const miss = gateMissing().filter(x => x.group)[0];
  if (miss) {
    if (miss.group) S.lab.tab = miss.group;
    /* the price on the profit tab comes from the task, so jump the task too */
    if (miss.group === 'profit') { S.lab.task = miss.id; S.lab.L = 0; }
  }
  openTasks(false);
  repaint();
};

/* award the insight the moment a lab task is banked */
function awardLabTask(id) {
  const t = LAB_TASKS.filter(x => x.id === id)[0];
  if (!t || S.lab.missions[id]) return 0;
  S.lab.missions[id] = 1;
  S.insight += t.reward;
  return t.reward;
}

/* ============================================================
   MARKET FORCES — debrief, teacher guide, boot
   ============================================================ */

function rankOf(v) {
  const max = { short: 420, std: 2450, full: 4600 }[S.mode] || 4600;
  const r = v / max;
  if (v < 0) return { t: 'AN EXPENSIVE LESSON', c: '#A3271B', note: 'You finished with a negative firm value. Every loss in this game came from a decision you can now explain.' };
  if (r >= 0.7) return { t: 'MARKET MOGUL', c: '#1D4ED8', note: 'You found the profitable ground in every market and protected it. Outstanding.' };
  if (r >= 0.45) return { t: 'PROFIT MAKER', c: PAL.blue, note: 'You read each market well and made the most of the power you were given.' };
  if (r >= 0.2) return { t: 'STEADY OPERATOR', c: PAL.green, note: 'You survived every market structure and earned a return. Look at the analysis below to find the profit you left behind.' };
  return { t: 'SURVIVOR', c: '#BE740F', note: 'You kept the firm alive through four very different markets. The next section shows where the money was.' };
}

function fillFirm(s) {
  return String(s)

    .replace(/~s~/g, seller())
    .replace(/~u~/g, prod().unitPl);
}

  <h3>6 &middot; Scoring and win conditions</h3>

    <li><b>There is no single winning number.</b> The pedagogically interesting comparison is <i>between</i> students: identical technology, wildly different outcomes \u2014 because of different guesses about rivals and different readings of the market.</li>

  <h3>7 &middot; Reflection questions and expected answers</h3>
  <div class="body">These are the questions shown on the student debrief page. The notes below are the direction a good answer should take, not a marking scheme.</div>
  <div class="q"><div class="qn">Chapter 1 &middot; Perfect competition</div><div class="ans">
    <b>Price taking.</b> Homogeneous product plus many sellers means each firm faces a horizontal demand curve at the market price; any price above it sells nothing. There is no price decision to make.
    <br><b>The three seasons.</b> $40 with three ${sellers()} and positive profit; entry pushed the price to $27 and profit to a loss; exit and rising demand restored the price to $34; continued entry drove it to $30, where price equals minimum AC and economic profit is zero.
    <br><b>Producing at a loss.</b> Fixed cost is payable either way. As long as P &gt; AVC, output contributes to fixed cost and reduces the loss. Shut down when P &lt; minimum AVC ($18 here).
    <br><b>Who gains.</b> Consumers gain the product at the lowest possible average cost and at a price equal to marginal cost. No one is made worse off in the allocative sense; the firms simply earn only normal profit, which is not a loss \u2014 it is the return available elsewhere.
  </div></div>
  <div class="q"><div class="qn">Chapter 2 &middot; Monopoly</div><div class="ans">
    <b>Price maker.</b> With no rivals and barriers to entry, the firm is the market: the market demand curve is its own, so quantity sold depends on the price it sets. A competitive firm faces a horizontal demand curve and quantity is its only choice.
    <br><b>MR &lt; P.</b> To sell one more unit the monopolist must lower its price, and the lower price applies to all the units it was already selling. The extra revenue is therefore the new price minus the revenue lost on the earlier units \u2014 always less than price.
    <br><b>Two losses.</b> The profit rectangle is a <i>transfer</i>: consumers pay more, the firm receives it. The deadweight loss triangle is a <i>destruction</i>: units that would have been worth more to buyers than they cost to produce are never made, and nobody receives that value.
    <br><b>Removing the barriers.</b> Take away the patent and rivals can copy the process, so the demand curve shifts left and the price falls towards cost. Take away the licence as well and entry becomes free, which is exactly the world of Chapter 1 \u2014 price competed down to minimum average cost and profit competed away to normal. The barriers, not the firm, are what create the power.
    <br><b>Monopsony.</b> The same firm, looking the other way down the market. As the town's only employer it faces an upward-sloping supply of labour, so hiring one more worker raises the wage for everyone it already employs: the marginal cost of labour is above the wage. It hires up to the point where that marginal cost equals the worker's marginal revenue product, then pays the lowest wage those workers will accept \u2014 below what they are worth to the firm. Workers lose the gap; employment is lower than it would be in a competitive labour market. Note the symmetry: in the product market the firm held price <i>above</i> marginal cost; in the input market it holds the wage <i>below</i> marginal revenue product. Both extract surplus and both shrink the quantity traded, and a deadweight loss appears either way.
    <br><b>Price cap.</b> The cap lowers price towards marginal cost, which removes the reason to restrict output. The firm keeps its licence and still earns a normal return, but the profit from restricting output disappears.
    <br><b>Both sides.</b> Against: higher prices, lower output, deadweight loss, weaker incentives to control costs ("X-inefficiency"). For: patent-protected monopoly profits can fund research that competitive firms cannot finance; large-scale production can lower average cost; and in natural monopoly a single producer is cheaper than duplicated networks. The exam answer is the balance, not a verdict.
  </div></div>
  <div class="q"><div class="qn">Chapter 3 &middot; Monopolistic competition</div><div class="ans">
    <b>Source of power.</b> Product differentiation \u2014 customers do not see the products as perfect substitutes, so the firm faces a downward-sloping demand curve and can choose price. The power is limited because close substitutes exist and entry is free.
    <br><b>The disappearing profit.</b> Imitation and entry shifted the firm\u2019s demand curve leftward. Cost curves unchanged, demand fell, so the profit-maximising price\u2013output combination moved to a point where P \u2248 AC.
    <br><b>Advertising.</b> In this model $140 of advertising costs $140 and lifts the price at which the same quantity can be sold, but only modestly: at launch it is roughly profit-neutral, after imitation it buys back about $10. Advertising pays only when the increase in demand (and the resulting margin) exceeds the cost of the campaign. Note the familiar "if it worked for everyone, it stops working for anyone" effect.
    <br><b>Versus perfect competition.</b> Price is above marginal cost and output is below the AC-minimising level (excess capacity), so the market is neither allocatively nor productively efficient. What consumers get in return is variety and choice.
    <br><b>Why the power is so much weaker than in Chapter 2.</b> In Chapter 2 a licence and a patent made entry illegal, so profit was protected. Here differentiation is the only defence and it can be copied, so the same firm ends up with a small, temporary margin instead of a durable one. This is the cleanest demonstration in the game that barriers to entry, not cleverness, decide how long profit lasts.
  </div></div>
  <div class="q"><div class="qn">Chapter 4 &middot; Oligopoly</div><div class="ans">
    <b>Best responses and Nash.</b> Whatever the rival does, cutting is the better move: if they hold, cutting earns $615 instead of $530; if they cut, cutting earns $250 instead of \u2212$125. So both cut, and the Nash equilibrium is the bottom-right cell \u2014 $250 each, worse for both than the $530 each available from mutual restraint.
    <br><b>The apparent contradiction.</b> This is the prisoner\u2019s dilemma: the joint-best outcome is not an equilibrium because each player has a unilateral incentive to deviate. Co-operation requires trust or enforcement, and neither is available.
    <br><b>Illegal versus wrong.</b> Price fixing is illegal under competition law because it restricts output and raises prices, harming consumers, and because the agreement is unstable it also wastes resources on policing it. Whether it is <i>wrong</i> is a normative question students should be able to argue both ways \u2014 the economics shows the damage, not the morality.
    <br><b>Enforceable cartel.</b> Output would fall and price rise towards the monopoly level; consumers and firms outside the agreement would lose; the two firms would split the resulting monopoly profit. This is why cartels are treated as a form of market failure.
    <br><b>Non-price competition.</b> It is legal, it can shift demand rather than merely redistribute it, and it is harder for a regulator to attack. It is also often self-cancelling, as the monopolistic competition chapter showed.
  </div></div>
  <div class="q"><div class="qn">Synthesis</div><div class="ans">
    The single factor is <b>barriers to entry</b> \u2014 which determine how much of the profit is competed away. Where entry is free, profit is competed to normal levels; where entry is blocked, the firm keeps it. The identical workshop across all four chapters is the proof that the source of profit is the market structure, not the firm.
  </div></div>

  <h3>8 &middot; Where this fits the syllabus</h3>
  <table class="dt">
    <thead><tr><th>Curriculum</th><th>Coverage</th></tr></thead>
    <tbody>
      <tr><td>AP Microeconomics</td><td>Unit 3 (Production, Cost, Perfect Competition) and Unit 4 (Imperfect Competition): production function, MP and AP, short-run costs, MC = MR, shutdown rule, long-run equilibrium and entry/exit, monopolistic competition and excess capacity, price discrimination, oligopoly and game theory, monopoly and deadweight loss. Unit 6 market failure and the role of government is touched on by the regulation episode.</td></tr>
      <tr><td>IGCSE Economics 0455</td><td>5.1 Production and costs, 5.2 The market and competition, 5.3 Monopoly, 5.4 Oligopoly, and the effects of market structure on price and output. The narrative version is deliberately usable at IGCSE level: run the Quick Round and use the first four debrief questions.</td></tr>
      <tr><td>IB Economics</td><td>Unit 1.5 Firms and market structures: perfectly competitive markets, monopoly, monopolistic competition, oligopoly and game theory, barriers to entry, profit maximisation, and the efficiency comparisons. Also links to 1.4 market failure and the role of the government.</td></tr>
      <tr><td>Business Studies</td><td>Profit maximisation, costs and breakeven, competitive strategy, branding and differentiation, business ethics and regulation.</td></tr>
    </tbody>
  </table>

  <h3>9 &middot; Common misconceptions and how the game corrects them</h3>
  <ul class="clean">
    <li><b>\u201cZero economic profit means the business is failing.\u201d</b> The long-run perfect competition chapter makes this concrete: the firm still covers every cost including the owner\u2019s labour and capital. Normal profit is a real return, not a loss.</li>
    <li><b>\u201cA monopolist can charge whatever it likes.\u201d</b> The price slider is bounded by demand: raise the price and quantity collapses. The game forces students to trade the two off.</li>
    <li><b>\u201cFirms only shut down when they make a loss.\u201d</b> Season two is designed to break this. Students lose less by producing than by stopping, and the reason is the fixed/variable cost split they met in the factory.</li>
    <li><b>\u201cIf you earned profit, you must have been skilful.\u201d</b> The comparison of Chapter 1 and Chapter 2 with identical technology is the corrective.</li>
    <li><b>\u201cMarginal revenue is just price.\u201d</b> Students meet MR = P in Chapter 1 and then watch it fall below P in Chapters 2 and 3.</li>
    <li><b>\u201cMarket power is only about what you charge.\u201d</b> The monopsony episode shows the same power applied to what you <i>pay</i>. Students who can see both sides of the firm \u2014 its customers and its suppliers \u2014 are much harder to fool.</li>
    <li><b>\u201cAdvertising always pays.\u201d</b> In the model it is close to self-cancelling. Some students find this genuinely surprising, and it is worth a short discussion of real advertising in monopolistically competitive markets.</li>
    <li><b>\u201cToo many workers is always better.\u201d</b> The production tab settles it: total product peaks, and past that point an extra worker <i>reduces</i> what the factory turns out. Marginal product goes below zero on the chart, and the table shows it as a negative number.</li>
  </ul>

  <h3>10 &middot; Practical notes</h3>
  <ul class="clean">
    <li><b>The factory does not hand over the data.</b> A row in the tables only fills in once a student has actually stopped on that crew size &mdash; and the charts are drawn through the points they have found, and no further. Finding the peak of MP, the peak of AP and the lowest point of AC is therefore real work, not reading. If you want to talk over the finished picture, <b>Reveal the whole table</b> on the production or cost tab fills everything in at once.</li>
    <li><b>The market price is never the student's to choose.</b> In the factory, the price on the profit tab is set by whichever task is selected, exactly as the market sets it. The only control is the crew size &mdash; which is the point of the chapter.</li>
    <li>One HTML file, no internet connection required, no installation. Open it in any modern browser.</li>
    <li>Progress is not saved if the tab is closed. Tell students to finish a chapter in one sitting.</li>
    <li>The A / A / A+ buttons in the top bar change the text size for projecting or for tablets.</li>
    <li>The debrief page can be printed; the Print button produces a clean write-up sheet.</li>
    <li>If you want to hide the Teacher button from students, add <code>?t=0</code> to the file path in the address bar.</li>
  </ul>
  <div class="btnrow no-print"><button class="btn primary" data-a="closeSheet">Close</button></div>`;
