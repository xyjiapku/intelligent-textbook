<!DOCTYPE html>
<html lang="en" data-fs="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARKET FORCES — A Firm's Journey</title>
<style>
:root{
  --bg:#E9EEF6; --bg2:#F4F7FC; --surface:#FFFFFF; --surface2:#F6F9FD;
  --ink:#122036; --ink2:#334155; --muted:#64748B; --faint:#94A3B8;
  --line:#E3E8F1; --line2:#C7D2E3;
  --brand:#2563EB; --brand-d:#1D4ED8; --brand-l:#3B82F6; --brand-soft:#EEF3FF;
  --good:#0F9D74; --goodbg:#E7F6F0; --good-d:#0B7A59;
  --bad:#E0494D; --badbg:#FDEEEF; --bad-d:#B42318;
  --warn:#C97A13; --warnbg:#FDF4E4; --warn-d:#9A5C0A;
  --gold:#D9A106; --goldbg:#FBF1D6;
  --violet:#7C5CFC;
  --r:18px; --r2:13px;
  --font-sans:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;
  --font-display:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --sh:0 1px 2px rgba(16,24,40,.04), 0 14px 34px -14px rgba(16,42,84,.14);
  --sh2:0 2px 8px rgba(16,24,40,.06), 0 22px 52px -16px rgba(16,42,84,.20);
}
html{font-size:19px}
html[data-fs="s"]{font-size:16.5px}
html[data-fs="l"]{font-size:21.5px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 560px at 6% -12%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(940px 540px at 102% -8%, rgba(37,99,235,.10) 0%, rgba(37,99,235,0) 56%),
    radial-gradient(820px 620px at 50% 118%, rgba(15,157,116,.07) 0%, rgba(15,157,116,0) 60%),
    linear-gradient(rgba(18,32,54,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(18,32,54,.04) 1px, transparent 1px);
  background-size:auto,auto,auto,28px 28px,28px 28px;
  color:var(--ink);
  font:1rem/1.55 var(--font-sans);
  min-height:100vh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(37,99,235,.18)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#C4D0E2;border:3px solid var(--bg);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#A9BBD4}
::-webkit-scrollbar-track{background:transparent}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(130% 95% at 50% 35%, rgba(255,255,255,0) 52%, rgba(18,32,54,.06) 100%)}
.shell{max-width:1180px;margin:0 auto;padding:1.15rem 1.15rem 4.2rem}
.pagecol{position:relative;z-index:1;min-width:0}

/* ---------------- the task panel ----------------
   A floating gold HUD, deliberately outside the page grid: it never steals width
   from the data, the simulation, the choices or the reports, and the reading
   column never changes size when it opens. Collapsed it is a badge; expanded it
   is a centred card over a light scrim. */
.taskfab{position:fixed;right:1.05rem;bottom:1.05rem;z-index:60;cursor:pointer;
  display:flex;align-items:center;gap:.55rem;padding:.45rem .85rem .45rem .5rem;
  border-radius:99px;border:1.5px solid var(--gold);color:#4A3200;
  background:linear-gradient(180deg,#FDF2C4,#F0C846);
  box-shadow:0 12px 30px -10px rgba(122,86,4,.55);font-weight:800;
  transition:transform .14s ease,box-shadow .14s ease}
.taskfab:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(122,86,4,.6)}
.taskfab.quiet{border-color:var(--line2);background:var(--surface);color:var(--ink2);
  box-shadow:0 8px 22px -12px rgba(16,42,84,.35)}
.taskfab.quiet:hover{box-shadow:0 12px 26px -12px rgba(16,42,84,.4)}
.taskfab.hide{display:none}
.tf-ring{flex:0 0 auto;display:block}
.tf-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12}
.tf-txt b{font-size:.95rem;letter-spacing:-.01em}
.tf-txt small{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.72}

.taskoverlay{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:3vmin 2.2vmin;background:rgba(10,20,36,.44);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .16s ease,visibility .16s ease}
.taskoverlay.show{opacity:1;visibility:visible}
.taskpanel{width:min(46rem,100%);max-height:86vh;overflow:auto;background:var(--surface);
  border:1px solid var(--line2);border-top:5px solid var(--gold);border-radius:var(--r);
  box-shadow:0 34px 90px -28px rgba(8,20,40,.55);padding:1.05rem 1.3rem 1.2rem;
  transform:translateY(8px) scale(.985);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.taskoverlay.show .taskpanel{transform:none}
.tp-head{display:flex;align-items:flex-start;gap:.8rem}
.tp-crest{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(160deg,#FDF2C4,#EFC542);border:1.5px solid var(--gold);color:#4A3200;font-size:1.15rem}
.tp-title{flex:1;min-width:0}
.tp-title h3{margin:.1rem 0 0;font-size:1.16rem}
.tp-kick{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tp-close{border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);cursor:pointer;
  width:2rem;height:2rem;border-radius:10px;font-size:.95rem;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.tp-close:hover{background:var(--badbg);border-color:var(--bad);color:var(--bad-d)}
.tp-bar{height:.5rem;border-radius:99px;background:var(--line);overflow:hidden;margin:.75rem 0 .25rem}
.tp-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#EFC542,#0F9D74);transition:width .25s ease}
.tp-barlab{display:flex;justify-content:space-between;gap:1rem;font-size:.72rem;color:var(--muted);font-weight:700}
.tp-list{margin:.8rem 0 0}
.tp-item{display:flex;gap:.7rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.tp-item:last-child{border-bottom:none}
.tp-num{flex:0 0 auto;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;
  font-size:.75rem;font-weight:800;background:var(--surface2);border:2px solid var(--line2);color:var(--muted)}
.tp-item.ok .tp-num{background:linear-gradient(180deg,#17B384,#0B825F);border-color:#0B825F;color:#fff}
.tp-item.armed .tp-num{background:linear-gradient(180deg,#FDF2C4,#EFC542);border-color:var(--gold);color:#4A3200;
  animation:pulse 1.5s ease-in-out infinite}
.tp-body{flex:1;min-width:0}
.tp-lab{font-size:1rem;line-height:1.4;font-weight:600}
.tp-item.ok .tp-lab{color:var(--muted);font-weight:500}
.tp-hint{font-size:.86rem;color:var(--muted);line-height:1.45;margin-top:.15rem}
.tp-item.armed .tp-hint{color:var(--warn-d);font-weight:700}
.tp-tag{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:99px;padding:.08rem .45rem;margin-left:.4rem;vertical-align:middle;white-space:nowrap}
.tp-tag.ok{background:var(--goodbg);color:var(--good-d)}
.tp-tag.armed{background:var(--goldbg);color:var(--warn-d)}
.tp-tag.open{background:var(--surface2);color:var(--muted)}
.tp-groups{margin-top:.85rem;padding-top:.7rem;border-top:1px solid var(--line)}
.tp-group{display:flex;align-items:center;gap:.55rem;font-size:.84rem;padding:.2rem 0}
.tp-group .tp-gn{flex:1;color:var(--ink2)}
.tp-group .tp-gp{font-weight:800;color:var(--muted)}
.tp-group.done .tp-gp{color:var(--good)}
.tp-foot{margin-top:.95rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.tp-note{flex:1;min-width:12rem;font-size:.82rem;color:var(--muted);line-height:1.45}
@media (max-width:640px){
  .taskfab{right:.7rem;bottom:.7rem}
  .tp-lab{font-size:.86rem}
  .taskpanel{padding:.9rem 1rem 1rem}
}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid rgba(199,210,227,.7);
  box-shadow:0 4px 18px -12px rgba(16,42,84,.18);
  display:flex;align-items:center;gap:.7rem;padding:.55rem 1.1rem;flex-wrap:wrap}
.topbar .tb-firm{display:flex;align-items:center;gap:.55rem;font-weight:800;letter-spacing:-.01em}
.tb-firm .chip{width:2.1rem;height:2.1rem;border-radius:11px;display:grid;place-items:center;
  font-size:1.08rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), 0 4px 10px -4px rgba(16,42,84,.35)}
.tb-name{max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-stats{margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.stat{background:linear-gradient(#fff,#F5F8FD);border:1px solid var(--line);border-radius:11px;
  padding:.24rem .6rem;display:flex;flex-direction:column;line-height:1.18;min-width:5.4rem;
  box-shadow:inset 0 1px 0 #fff}
.stat b{font-size:.95rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.stat.pos b{color:var(--good)} .stat.neg b{color:var(--bad)}
.fsgroup{display:flex;gap:.2rem;align-items:center}
.fsbtn{border:1px solid var(--line);background:linear-gradient(#fff,#F6F9FE);border-radius:8px;width:1.65rem;height:1.65rem;
  cursor:pointer;font-size:.72rem;font-weight:800;color:var(--muted);line-height:1;transition:all .12s ease}
.fsbtn:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-soft)}
.iconbtn{border:1px solid var(--line);background:linear-gradient(#fff,#F6F9FE);border-radius:10px;padding:.32rem .65rem;
  cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ink2);transition:all .12s ease}
.iconbtn:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-soft)}
.tb-progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:rgba(199,210,227,.45)}
.tb-progress i{display:block;height:100%;border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,var(--brand-l),var(--brand-d));box-shadow:0 0 8px rgba(37,99,235,.5);
  transition:width .5s cubic-bezier(.2,.7,.2,1)}

/* ---------------- cards & type ---------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:1.3rem 1.4rem;margin-bottom:1.1rem;position:relative}
.card.tight{padding:.95rem 1.1rem}
.kicker{font-size:.66rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-d);
  display:inline-flex;align-items:center;gap:.5em}
.kicker::before{content:'';width:3px;height:.95em;border-radius:2px;background:linear-gradient(var(--brand-l),var(--brand-d))}
h1{font-family:var(--font-display);font-size:2.5rem;line-height:1.08;margin:.2rem 0 .4rem;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--font-display);font-size:1.55rem;line-height:1.22;margin:.12rem 0 .35rem;letter-spacing:-.012em;color:var(--ink)}
h3{font-size:1rem;margin:.95rem 0 .4rem;font-weight:800;letter-spacing:-.01em}
.lead{font-size:1.06rem;color:var(--ink2);margin:.35rem 0 .55rem}
.body{font-size:.95rem;color:var(--ink2)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.72rem}
.narr{font-size:.96rem;color:var(--ink2);margin:.5rem 0;line-height:1.6}
.narr b{color:var(--ink)}
hr.sep{border:none;border-top:1px solid var(--line);margin:.9rem 0}
ul.clean,ol.clean{margin:.45rem 0 .45rem 1.15rem;padding:0}
ul.clean li,ol.clean li{margin:.32rem 0;font-size:.93rem;color:var(--ink2);line-height:1.55}
b{color:inherit}

/* note surfaces (replace inline colour styles) */
[data-note]{border:1px solid transparent;border-radius:var(--r2)}
[data-note="flat"]{background:var(--surface2);border-color:var(--line)}
[data-note="amber"]{background:linear-gradient(100deg,#FDF7E7,#FFFDF6);border-color:#EDD9A8}
[data-note="blue"]{background:linear-gradient(100deg,#F2F7FF,#FBFDFF);border-color:#C7DCFB}
[data-note="red"]{background:linear-gradient(100deg,#FDF0F1,#FFFDFD);border-color:#F6C7CB}

/* ---------------- buttons ---------------- */
.btn{border:1px solid var(--line2);background:linear-gradient(#fff,#F5F8FD);color:var(--ink);border-radius:12px;
  padding:.58rem 1rem;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 1px 2px rgba(16,24,40,.05),inset 0 1px 0 #fff;
  transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease, color .15s ease}
.btn:hover{border-color:var(--brand);color:var(--brand-d);transform:translateY(-1px);
  box-shadow:0 8px 18px -8px rgba(37,99,235,.4)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,var(--brand-l),var(--brand-d));border-color:var(--brand-d);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 8px 20px -8px rgba(37,99,235,.55)}
.btn.primary:hover{background:linear-gradient(180deg,var(--brand),#1B44C4);border-color:#1B44C4;color:#fff}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btnrow{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-top:.95rem}
.btnrow.right{justify-content:flex-end}
.btn.big{padding:.72rem 1.35rem;font-size:1rem;border-radius:13px}
.btn:focus-visible,.opt:focus-visible,.prod:focus-visible,.sw:focus-visible,.checkopt:focus-visible,
.fsbtn:focus-visible,.iconbtn:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:2px}

/* ---------------- progress steps ---------------- */
.steps{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .95rem}
.stepdot{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  background:linear-gradient(#fff,#F3F6FB);border:1px solid var(--line);border-radius:99px;padding:.24rem .65rem}
.stepdot.on{color:var(--brand-d);border-color:#B9D2FB;background:linear-gradient(#F4F8FF,#EAF1FF);
  box-shadow:0 3px 10px -6px rgba(37,99,235,.5)}
.stepdot.done{color:var(--good-d);border-color:#A8DEC8;background:linear-gradient(#EFFAF5,#E4F5EC)}
.ch-icon{flex:none;width:3rem;height:3rem;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;
  background:linear-gradient(140deg,#F4F8FF,#E3EDFF);border:1px solid #C7DCFB;
  box-shadow:inset 0 1px 0 #fff,0 6px 14px -8px rgba(37,99,235,.45)}

/* ---------------- setup ---------------- */
.grid2{display:grid;grid-template-columns:1.25fr .95fr;gap:1.1rem;align-items:start}
.grid2.rev{grid-template-columns:.95fr 1.25fr}
.prodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.6rem 0 .2rem}
.prod{border:1.5px solid var(--line);background:linear-gradient(#fff,#FAFCFF);border-radius:15px;padding:.7rem .5rem .6rem;cursor:pointer;
  text-align:center;transition:all .15s ease;position:relative;font-family:inherit}
.prod:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--sh)}
.prod .em{font-size:1.55rem;line-height:1;display:grid;place-items:center;width:3.1rem;height:3.1rem;margin:0 auto .35rem;
  border-radius:12px;background:linear-gradient(145deg,#F4F8FE,#E9EFF8);box-shadow:inset 0 0 0 1px rgba(199,210,227,.6)}
.prod .nm{font-size:.78rem;font-weight:800;margin-top:.2rem;color:var(--ink2)}
.prod .un{font-size:.66rem;color:var(--muted)}
.prod.sel{border-color:var(--brand);background:linear-gradient(160deg,#F6FAFF,#EBF2FF);
  box-shadow:0 10px 24px -12px rgba(37,99,235,.5)}
.prod.sel .nm{color:var(--brand-d)}
.prod.sel::after{content:'\2713';position:absolute;top:.4rem;right:.45rem;width:1.15rem;height:1.15rem;
  border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:.7rem;font-weight:900;
  box-shadow:0 2px 6px -1px rgba(37,99,235,.6)}
.swatches{display:flex;gap:.55rem;flex-wrap:wrap;margin:.55rem 0}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;border:3px solid #fff;
  box-shadow:0 0 0 1.5px var(--line2),0 3px 8px -2px rgba(16,42,84,.25);transition:transform .12s ease;position:relative}
.sw:hover{transform:scale(1.1)}
.sw.sel{box-shadow:0 0 0 3px var(--ink),0 4px 10px -2px rgba(16,42,84,.35)}
.sw.sel::after{content:'\2713';position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  font-size:.8rem;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.45)}
input[type=text]{font:inherit;font-size:.95rem;padding:.55rem .75rem;border-radius:11px;
  border:1.5px solid var(--line2);width:100%;background:#fff;color:var(--ink);transition:all .12s ease}
input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(37,99,235,.14)}
.preview{border-radius:16px;padding:1.15rem;color:#fff;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 16px 34px -16px rgba(16,42,84,.5)}
.preview::before{content:'';position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(rgba(255,255,255,.9) 1.4px,transparent 1.5px);background-size:15px 15px}
.preview::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(0,0,0,.32))}
.preview .pv-in{position:relative;z-index:2}
.preview .pv-em{font-size:2.7rem;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.preview .pv-nm{font-family:var(--font-display);font-size:1.25rem;font-weight:700;margin-top:.3rem;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.preview .pv-tag{font-size:.72rem;opacity:.92;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.tagline{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9}

/* ---------------- tables ---------------- */
table.dt{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
table.dt th{background:linear-gradient(#F6F9FE,#EFF3F9);color:var(--muted);font-size:.67rem;text-transform:uppercase;
  letter-spacing:.07em;font-weight:800;padding:.48rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{padding:.38rem .55rem;border-bottom:1px solid #EEF2F8;text-align:right;color:var(--ink2)}
table.dt tbody tr:nth-child(even) td{background:#FAFBFE}
table.dt tbody tr:hover td{background:#F1F6FF}
table.dt tr.hl td{background:linear-gradient(#FEF7DF,#FDF2D2)!important;color:var(--ink);font-weight:800}
table.dt tr.pick td{background:#EAF2FF!important;color:var(--brand-d);font-weight:800}
table.dt td.bad{color:var(--bad)} table.dt td.good{color:var(--good)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r2);max-height:23rem;background:#fff;
  box-shadow:inset 0 1px 3px rgba(16,42,84,.04)}

table.mx{width:100%;border-collapse:separate;border-spacing:.35rem;font-size:.9rem}
table.mx th{font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;padding:.3rem}
table.mx td{border:1.5px solid var(--line);border-radius:13px;padding:.6rem .4rem;text-align:center;
  background:linear-gradient(#fff,#F8FAFD);font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 #fff;transition:all .12s ease}
table.mx td small{display:block;font-size:.67rem;color:var(--muted);font-weight:700;margin-top:.15rem}
table.mx td.you{background:linear-gradient(#F4F8FF,#E9F1FF);border-color:var(--brand);
  box-shadow:0 6px 16px -10px rgba(37,99,235,.5),inset 0 1px 0 #fff}
table.mx td.you b{color:var(--brand-d)}
table.mx td b{font-size:1.06rem}
table.mx td.taken{box-shadow:inset 0 0 0 3px rgba(217,161,6,.6);background:linear-gradient(#FEF9E6,#FDF1CE)}

/* ---------------- metric tiles ---------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6rem,1fr));gap:.5rem;margin:.6rem 0}
.tile{background:linear-gradient(#fff,#F8FAFD);border:1px solid var(--line);border-radius:var(--r2);
  padding:.5rem .55rem .5rem .65rem;position:relative;overflow:hidden;transition:all .13s ease}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.tile:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(16,42,84,.3)}
.tile .tl{font-size:.61rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;line-height:1.3}
.tile .tv{font-size:1.16rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.01em}
.tile .ts{font-size:.65rem;color:var(--faint);line-height:1.35}
.tile.pos::before{background:var(--good)} .tile.pos .tv{color:var(--good)}
.tile.neg::before{background:var(--bad)} .tile.neg .tv{color:var(--bad)}
.tile.hi{background:linear-gradient(#F5F9FF,#ECF3FF);border-color:#C7DCFB}
.tile.hi::before{background:var(--brand)}
.tile.hi .tv{color:var(--brand-d)}
.tile.warn{background:linear-gradient(#FDF8EC,#FDF2DC);border-color:#EEDBAD}
.tile.warn::before{background:var(--warn)}

/* ---------------- controls ---------------- */
.ctl{margin:.9rem 0}
.ctl .clab{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.35rem}
.ctl .clab .t{font-size:.85rem;font-weight:800;color:var(--ink)}
.ctl .clab .v{font-size:1.15rem;font-weight:800;color:var(--brand-d);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.5rem;background:transparent;cursor:pointer;margin:0;--pct:50%}
input[type=range]::-webkit-slider-runnable-track{height:.55rem;border-radius:99px;
  background:linear-gradient(90deg,var(--brand-l) var(--pct),#DCE4EF var(--pct));
  box-shadow:inset 0 1px 2px rgba(16,42,84,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5rem;height:1.5rem;border-radius:50%;
  background:linear-gradient(180deg,#fff,#E6EEFB);border:3px solid var(--brand);
  box-shadow:0 2px 8px rgba(16,42,84,.35),inset 0 1px 0 #fff;margin-top:-.48rem;transition:transform .1s ease}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.08)}
input[type=range]::-moz-range-track{height:.55rem;border-radius:99px;background:#DCE4EF;
  box-shadow:inset 0 1px 2px rgba(16,42,84,.12)}
input[type=range]::-moz-range-progress{height:.55rem;border-radius:99px;background:var(--brand-l)}
input[type=range]::-moz-range-thumb{width:1.2rem;height:1.2rem;border-radius:50%;
  background:linear-gradient(180deg,#fff,#E6EEFB);border:3px solid var(--brand);
  box-shadow:0 2px 8px rgba(16,42,84,.35)}
.ticks{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint);font-weight:700;margin-top:.05rem}

/* ---- sliders get a minus and a plus: dragging is for exploring, the buttons
   are for landing exactly on a value ---- */
.srow{display:flex;align-items:center;gap:.5rem}
.srow input[type=range]{flex:1;min-width:0}
.sbtn{flex:0 0 auto;width:2.5rem;height:2.5rem;border-radius:12px;border:1.5px solid var(--line2);
  background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:800;cursor:pointer;
  display:grid;place-items:center;line-height:1;user-select:none;font-variant-numeric:tabular-nums;
  transition:background .12s ease,border-color .12s ease,transform .08s ease}
.sbtn:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d)}
.sbtn:active{transform:translateY(1px)}

/* ---- live readout strip: the numbers that have to stay in view while the
   student is moving something ---- */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.6rem,1fr));gap:.45rem;margin-top:.55rem}
.readout .ro{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:.4rem .55rem;min-width:0}
.readout .ro .rl{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout .ro .rv{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.01em}
.readout .ro.hi{background:linear-gradient(#F2F7FF,#E8F1FF);border-color:#C7DCFB}
.readout .ro.hi .rv{color:var(--brand-d)}
.readout .ro.pos .rv{color:var(--good)}
.readout .ro.neg .rv{color:var(--bad)}
.readout .ro.warn{background:linear-gradient(#FDF8EC,#FDF2DC);border-color:#EEDBAD}
.readout .ro.warn .rv{color:var(--warn-d)}

/* ---- sticky decision bar: controls AND numbers pinned under the top bar, so
   the chart below can be watched while something is being dragged ---- */
.decbar{position:sticky;top:calc(var(--topbar-h, 3.4rem) + .35rem);z-index:26;background:var(--surface);
  margin:.35rem -1.25rem .7rem;padding:.65rem 1.25rem .7rem;
  border-bottom:1px solid var(--line);box-shadow:0 10px 20px -18px rgba(16,42,84,.45)}
.decbar .ctl{margin:0}
.decbar .readout{margin-top:.5rem}
.decbar .ctl+.ctl{margin-top:.6rem}

/* ---- the notebook, living inside the task panel ---- */
.tp-book{margin:.8rem 0 0;padding:.7rem .8rem;border-radius:12px;
  background:linear-gradient(180deg,#FEFAF0,#FDF4DE);border:1px solid #EBD9A8}
.tp-book .tbrow{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;font-size:.84rem}
.tp-book .tbrow b{font-weight:800;color:#7A5600}
.tp-book .tp-bar{margin:.5rem 0 .2rem;background:#EFE3C6}
.tp-book .tbnote{font-size:.76rem;color:#8A6A28;line-height:1.4}

.optrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.opt{border:1.5px solid var(--line);background:linear-gradient(#fff,#F8FBFE);border-radius:13px;padding:.55rem .85rem;cursor:pointer;
  font-weight:800;font-size:.85rem;color:var(--ink2);transition:all .14s ease;text-align:left;font-family:inherit}
.opt:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 6px 14px -10px rgba(16,42,84,.3)}
.opt.sel{border-color:var(--brand);background:linear-gradient(160deg,#F5F9FF,#EAF1FF);color:var(--brand-d);
  box-shadow:0 8px 18px -12px rgba(37,99,235,.55)}
.opt small{display:block;font-weight:600;font-size:.66rem;color:var(--muted);margin-top:.1rem}
.opt.sel small{color:#5B7FCF}

/* ---------------- check / quiz ---------------- */
.checkopt{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;border:1.5px solid var(--line);
  background:linear-gradient(#fff,#F9FBFE);border-radius:13px;padding:.65rem .85rem;margin:.45rem 0;cursor:pointer;
  font-size:.9rem;font-weight:600;color:var(--ink2);font-family:inherit;transition:all .13s ease}
.checkopt:hover{border-color:var(--brand);color:var(--ink);transform:translateX(2px)}
.checkopt .optkey{flex:none;width:1.5rem;height:1.5rem;border-radius:9px;display:grid;place-items:center;
  font-size:.75rem;font-weight:900;background:var(--brand-soft);color:var(--brand-d);border:1px solid #C7DCFB}
.checkopt.ok{border-color:var(--good);background:linear-gradient(100deg,#EDFAF4,#F7FDF9);color:#0A5C40}
.checkopt.ok .optkey{background:var(--good);color:#fff;border-color:var(--good)}
.checkopt.no{border-color:var(--bad);background:linear-gradient(100deg,#FDEEEF,#FFF9F9);color:#A3271B}
.checkopt.no .optkey{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:.65rem;padding:.7rem .9rem;border-radius:var(--r2);font-size:.87rem;line-height:1.55;display:none}
.fb.show{display:block;animation:rise .35s ease both}
.fb.ok{background:linear-gradient(100deg,#EDFAF4,#F7FDF9);border-left:4px solid var(--good);color:#0A5C40}
.fb.no{background:linear-gradient(100deg,#FDEEEF,#FFF9F9);border-left:4px solid var(--bad);color:#A3271B}

/* ---------------- event / narrative ---------------- */
.event{border-left:5px solid var(--brand);background:linear-gradient(105deg,#F3F9FF,#FFFFFF 45%);overflow:hidden}
.event.warn{border-left-color:var(--warn);background:linear-gradient(105deg,#FEF7E8,#FFFFFF 45%)}
.event.bad{border-left-color:var(--bad);background:linear-gradient(105deg,#FDEEEF,#FFFFFF 45%)}
.event.good{border-left-color:var(--good);background:linear-gradient(105deg,#ECFAF3,#FFFFFF 45%)}
.event::after{content:'\25C6';position:absolute;right:1rem;top:1.4rem;font-size:5.5rem;line-height:1;
  font-weight:900;opacity:.06;pointer-events:none}
.event.warn::after{content:'!'}
.event.bad::after{content:'\2715'}
.event.good::after{content:'\2713'}
.evt-tag{display:inline-block;font-size:.62rem;font-weight:900;letter-spacing:.13em;text-transform:uppercase;
  padding:.2rem .6rem;border-radius:99px;background:linear-gradient(180deg,#26364F,#122036);color:#fff;
  box-shadow:0 4px 10px -4px rgba(16,42,84,.5)}
.evt-tag.warn{background:linear-gradient(180deg,#D98A26,#B7680B)}
.evt-tag.bad{background:linear-gradient(180deg,#E96063,#C93337)}
.evt-tag.good{background:linear-gradient(180deg,#17B384,#0B825F)}
.pricetag{display:inline-flex;align-items:baseline;gap:.4rem;border-radius:11px;padding:.35rem .8rem;font-weight:800;
  color:#fff;background:linear-gradient(180deg,#26364F,#0E1828);box-shadow:0 8px 18px -10px rgba(16,42,84,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.pricetag .old{font-size:.8rem;opacity:.55;text-decoration:line-through}
.pricetag .new{font-size:1.28rem;font-variant-numeric:tabular-nums}
.delta{font-weight:800;font-size:.85rem}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.delta.up::before{content:'\25B2\00a0';font-size:.7em}
.delta.down::before{content:'\25BC\00a0';font-size:.7em}

/* ---------------- chart ---------------- */
.chartcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:.55rem .4rem .2rem;margin:.75rem 0;
  box-shadow:0 1px 2px rgba(16,24,40,.04),inset 0 1px 0 #fff}
.labctl{position:sticky;top:3.6rem;z-index:20;box-shadow:var(--sh2);margin-bottom:.95rem}
.chartcard svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:.75rem;flex-wrap:wrap;font-size:.72rem;color:var(--ink2);font-weight:700;
  padding:.15rem .6rem .45rem}
.legend i{display:inline-block;width:.9rem;height:.25rem;border-radius:2px;margin-right:.3rem;vertical-align:middle}
.legend i.dot{width:.55rem;height:.55rem;border-radius:50%}
svg text{font-family:inherit}
.ct{fill:var(--faint);font-size:.68rem}
.cl{fill:var(--ink2);font-size:.76rem;font-weight:800}
.cn{fill:var(--ink);font-size:.78rem;font-weight:800}
.ca{fill:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.04em}
.cw{fill:#fff;font-size:.75rem;font-weight:900}
.ax{stroke:#B9C6D9;stroke-width:1.6;fill:none}
.gr{stroke:#E8EEF6;stroke-width:1;stroke-dasharray:3 5}
.bar-axis{stroke:var(--ink2);stroke-width:1.6}
rect.zone-good{fill:#0F9D74;opacity:.13}
rect.zone-bad{fill:#E0494D;opacity:.13}
polygon.dwl{fill:#E0494D;opacity:.2;stroke:#E0494D;stroke-width:1.2}
.line-profit{stroke:#D9A106;stroke-width:1.4;stroke-dasharray:4 3}

/* ---------------- misc ---------------- */
.pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:.22rem .6rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.b{background:var(--brand-soft);border-color:#C7DCFB;color:var(--brand-d)}
.pill.g{background:linear-gradient(180deg,#17B384,#0B825F);border-color:#0B825F;color:#fff}
.pill.w{background:var(--warnbg);border-color:#EEDBAD;color:var(--warn-d)}
.pill.amber{background:linear-gradient(180deg,#F6D98A,#E2A93A);border-color:#C9922A;color:#4A3200;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-1px);opacity:.82}}
.pill.r{background:var(--badbg);border-color:#F6C7CB;color:var(--bad-d)}
.pill.coin{background:linear-gradient(180deg,#FBE089,#E8B10A);border-color:#D29A05;color:#6B4E00;
  box-shadow:0 3px 8px -3px rgba(217,161,6,.6),inset 0 1px 0 rgba(255,255,255,.6)}
.shoprow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:stretch;margin:.3rem 0}
.shop{--shop:var(--brand);position:relative;border-radius:13px;padding:1.35rem .45rem .5rem;text-align:center;
  font-size:.6rem;font-weight:800;color:var(--ink2);min-width:5rem;
  background:linear-gradient(#fff,#F6F9FD);border:1.5px solid #DFE7F2;
  box-shadow:var(--sh);transition:all .3s ease}
.shop::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;border-radius:11px 11px 3px 3px;
  background:repeating-linear-gradient(45deg,var(--shop) 0 8px,#fff 8px 16px);
  box-shadow:0 2px 4px -2px rgba(16,42,84,.3)}
.shop .e{display:grid;place-items:center;width:2.1rem;height:2.1rem;margin:0 auto .25rem;border-radius:50%;
  font-size:1.1rem;background:#fff;border:1.5px solid var(--shop);box-shadow:0 3px 8px -4px rgba(16,42,84,.35)}
.shop > div{line-height:1.3;padding:0 .15rem}
.shop > div + div{font-weight:600;color:var(--muted)}
.shop.closed{filter:grayscale(1);opacity:.4}
.shop.mine{border-color:var(--gold);box-shadow:0 0 0 2.5px var(--gold),var(--sh)}
.shop.mine::after{content:'YOU';position:absolute;top:-.5rem;right:-.55rem;background:linear-gradient(180deg,#F2C037,#D9A106);
  color:#5C4400;font-size:.55rem;font-weight:900;letter-spacing:.08em;padding:.14rem .36rem;border-radius:99px;
  box-shadow:0 3px 7px -2px rgba(217,161,6,.7);transform:rotate(6deg)}
.scoreline{display:flex;justify-content:space-between;gap:.6rem;padding:.5rem .15rem;
  border-bottom:1px dashed #E6ECF5;font-size:.88rem;transition:background .12s ease}
.scoreline:hover{background:#F8FAFE}
.scoreline b{font-variant-numeric:tabular-nums}
.bigscore{font-family:var(--font-display);font-size:2.7rem;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1}
.rankcard{border-radius:20px;padding:1.4rem 1.6rem;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 55%,#0EA5E9 100%);
  box-shadow:0 22px 46px -20px rgba(29,78,216,.6)}
.rankcard::before{content:'';position:absolute;inset:0;opacity:.25;
  background-image:radial-gradient(rgba(255,255,255,.85) 1.4px,transparent 1.5px);background-size:19px 19px}
.rankcard::after{content:'';position:absolute;width:17rem;height:17rem;right:-5rem;top:-7rem;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.rankcard>*{position:relative;z-index:1}
.rankcard h2{color:#fff;margin:0;font-size:2.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(220%);bottom:1.3rem;z-index:80;
  background:rgba(18,32,54,.94);backdrop-filter:blur(8px);color:#fff;padding:.65rem 1.15rem;border-radius:99px;
  font-weight:700;font-size:.88rem;box-shadow:0 16px 36px -10px rgba(16,42,84,.5);
  transition:transform .32s cubic-bezier(.2,.9,.3,1.2),opacity .25s ease,visibility .25s;
  opacity:0;visibility:hidden;pointer-events:none;max-width:84vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.optgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:.5rem 0 .2rem}
.optgrid3 .opt{position:relative}
.optgrid3 .opt.sel::after{content:'\2713';position:absolute;top:.4rem;right:.5rem;color:var(--brand);font-weight:900}
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.46);backdrop-filter:blur(4px);
  display:none;padding:1.2rem;overflow:auto}
.modal.show{display:block;animation:fadeBg .25s ease both}
.sheet{background:#fff;max-width:900px;margin:0 auto;border-radius:20px;box-shadow:var(--sh2);
  max-height:calc(100vh - 2.4rem);overflow:auto;padding:1.5rem 1.7rem}
.modal.show .sheet{animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.1) both}
.sheet h2{margin-top:0}
.sheet .close{position:sticky;top:0;float:right;z-index:2}
.tag{font-size:.68rem;font-weight:800;padding:.14rem .5rem;border-radius:7px;background:var(--surface2);
  border:1px solid var(--line);color:var(--muted);margin-right:.3rem;white-space:nowrap;display:inline-block}
.q{border-left:3px solid var(--brand);padding:.4rem 0 .4rem .8rem;margin:.9rem 0;
  background:linear-gradient(90deg,rgba(37,99,235,.05),transparent 60%);border-radius:0 10px 10px 0;padding-right:.6rem}
.q .qn{font-weight:800;color:var(--ink)}
.q .ans{font-size:.84rem;color:var(--muted);margin-top:.25rem;line-height:1.55}
.q .ans b{color:var(--ink2)}

/* ---------------- title hero ---------------- */
.wordmark{font-family:var(--font-display);font-size:3.1rem;line-height:1.02;font-weight:700;letter-spacing:-.025em;margin:.25rem 0;
  background:linear-gradient(115deg,#122036 10%,#1D4ED8 58%,#0EA5E9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.herorule{display:flex;align-items:center;gap:.7rem}
.herorule::before,.herorule::after{content:'';height:1px;flex:1;
  background:linear-gradient(90deg,transparent,#C7D2E3);border-radius:1px}
.herorule::after{background:linear-gradient(90deg,#C7D2E3,transparent)}
.featlist{list-style:none;margin:.5rem 0;padding:0}
.feat{display:flex;gap:.7rem;align-items:flex-start;margin:.6rem 0}
.feat .fnum{flex:none;width:1.75rem;height:1.75rem;border-radius:11px;display:grid;place-items:center;
  font-size:.8rem;font-weight:900;color:var(--brand-d);background:linear-gradient(160deg,#F4F8FF,#E3EDFF);
  border:1px solid #C7DCFB;box-shadow:inset 0 1px 0 #fff}
.feat .ftxt{font-size:.93rem;color:var(--ink2);line-height:1.5;padding-top:.15rem}
.feat .ftxt b{color:var(--ink)}
.jpanel{border-radius:18px;padding:1.2rem 1.2rem .9rem;color:#E8EEFB;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1B2C49,#0E1A2F);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 22px 44px -20px rgba(10,22,48,.7)}
.jpanel::before{content:'';position:absolute;inset:0;opacity:.22;
  background-image:radial-gradient(rgba(255,255,255,.8) 1.3px,transparent 1.4px);background-size:17px 17px}
.jpanel>*{position:relative;z-index:1}
.jrow{display:flex;align-items:center;gap:.7rem;padding:.32rem 0;position:relative}
.jrow .jdisc{flex:none;width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;font-size:1.18rem;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.jrow .jt{font-weight:800;font-size:.92rem}
.jrow .js{font-size:.68rem;color:rgba(232,238,251,.62);font-weight:600;letter-spacing:.02em}
.jrow:not(:first-child)::before{content:'';position:absolute;left:1.18rem;top:-.34rem;width:2px;height:.68rem;
  background:rgba(255,255,255,.18)}
.jrow.off{opacity:.35}
.jpanel hr.sep{border-color:rgba(255,255,255,.12)}

/* ---------------- animations ---------------- */
.fade,.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#app>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}
#app>*:nth-child(4){animation-delay:.15s}#app>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spark{animation:spark 1.1s ease both}
@keyframes spark{0%{box-shadow:0 0 0 0 rgba(217,161,6,.55)}100%{box-shadow:0 0 0 18px rgba(217,161,6,0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (max-width:880px){
  .grid2,.grid2.rev{grid-template-columns:1fr}
  .prodgrid{grid-template-columns:repeat(2,1fr)}
  .optgrid3{grid-template-columns:1fr}
  h1{font-size:1.85rem}.wordmark{font-size:2.3rem}h2{font-size:1.3rem}
  .event::after{font-size:4rem}
}
@media print{
  .topbar,.btnrow,.no-print,.tb-progress{display:none !important}
  body{background:#fff;background-image:none}
  .modal{position:static;background:#fff;padding:0;display:block;backdrop-filter:none}
  .sheet{max-height:none;box-shadow:none;padding:0;animation:none}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  #app>*{animation:none}
}

/* ============================================================
   v2 POLISH LAYER
   Chart-first decision workspace, compact lab toolbar,
   hand-drawn SVG icon sizing, tighter rhythm.
   ============================================================ */
.shell{max-width:1240px}

/* ---- lab: compact two-zone control toolbar ---- */
.labbar{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:.85rem 1.15rem;align-items:start}

  .labbar{grid-template-columns:1fr}

.em svg{width:2.15rem;height:2.15rem}

/* ---- factory illustration: softer card frame ---- */

@media (max-width:1040px){
  .decwork,.decwork-nc{grid-template-columns:1fr}
  .decrail{position:static;order:1}

  .decmatrix{order:2}
}

</head>
<body>
<div class="vignette"></div>
<header class="topbar" id="topbar"></header>
<main class="shell" id="shell"><div class="pagecol" id="app"></div></main>
<button class="taskfab hide" id="taskfab" data-a="task-open" aria-expanded="false"></button>
<div class="taskoverlay" id="taskoverlay" data-a="task-scrim"><div class="taskpanel" id="taskpanel" role="dialog" aria-label="Tasks"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>

/* ============================================================
   MARKET FORCES — economics engine
   All numbers in this file are validated by scripts/verify.js
   ============================================================ */

const ECON = {
  /* --- the technology of the firm (short run) --------------------------
     Q = K * q(x),  x = L/K,  q(x) = A1*x + A2*x^2 - A3*x^3

     The cubic is the textbook short-run production function, and every shape
     the lesson needs falls straight out of the algebra rather than out of
     fitted constants:

        average product peaks at x = A2/(2*A3) = 4   -> minimum AVC sits at 4K workers
        marginal product peaks at x = A2/(3*A3) = 3
        marginal product cuts average product exactly at AP's peak
        total product peaks at x = 8K, then FALLS    -> MP goes negative from worker 8K+1

     That last property is the whole reason for the change: the previous
     hyperbolic function was strictly increasing, so "too many workers and output
     actually falls" could not be shown at all.

     Calibrated so that minimum AVC is $18.00 and average product peaks at 6.00
     units per worker — the two anchors the rest of the game is built on.
     -------------------------------------------------------------------- */
  A1: 4.8, A2: 0.6, A3: 0.075,
  X_TPP: 8,        // workers per machine at which total product peaks
  AP_X: 4,         // workers per machine at which average product peaks
  AP_MAX: 6,       // output per worker at that peak

  LAND: 200,      // rent for the workshop (fixed factor: LAND) per period
  MACHINE: 150,   // lease cost of one unit of capital. Named MACHINE for history;
                  // the UI always calls it by the product's own capital good
                  // (oven, roaster, press, lathe, vat, polytunnel).
  WAGE: 90,       // wage per worker per period (variable factor: LABOUR)
  MAT: 3,         // raw material cost per unit of output (variable factor)

  /* How many workers are worth offering the student, given K machines.
     It has to reach past the point where total product turns down (x = 8K), or
     the student never sees marginal product go negative. 10.5K leaves about two
     and a half workers of falling output in view, which is enough to be obvious
     without descending into nonsense. 12 is the floor so one unit of capital
     still has a usable slider. */
  maxL(K) { return Math.max(12, Math.ceil(10.5 * K)); },

  /* the most this plant can physically turn out in a period */
  capacity(K) {
    const x = ECON.X_TPP;
    return K * (ECON.A1 * x + ECON.A2 * x * x - ECON.A3 * x * x * x);
  },

  /* output per machine q(x); never negative, the cubic is only meaningful
     up to the point where it comes back down to zero */
  qx(x) { return Math.max(0, ECON.A1 * x + ECON.A2 * x * x - ECON.A3 * x * x * x); },

  output(K, L) {
    if (L <= 0) return 0;
    return K * ECON.qx(L / K);
  },
  /* a discrete difference, on purpose: this is what makes MP turn negative and
     visible as a column in the table */
  mp(K, L) { return L <= 0 ? 0 : ECON.output(K, L) - ECON.output(K, L - 1); },
  ap(K, L) { return L <= 0 ? 0 : ECON.output(K, L) / L; },

  tfc(K) { return ECON.LAND + ECON.MACHINE * K; },
  tvc(K, L) { return ECON.WAGE * L + ECON.MAT * ECON.output(K, L); },
  tc(K, L) { return ECON.tfc(K) + ECON.tvc(K, L); },

  ac(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tc(K, L) / q : Infinity; },
  avc(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tvc(K, L) / q : Infinity; },
  afc(K, L) { const q = ECON.output(K, L); return q > 0 ? ECON.tfc(K) / q : Infinity; },

  /* marginal cost = extra total cost of the next worker / extra output.
     Past the peak of total product the next worker REDUCES output, so the extra
     output is negative and marginal cost is not defined: no firm would ever go
     there, and the charts must not pretend otherwise. */
  mc(K, L) {
    if (L <= 0) return Infinity;
    const dq = ECON.output(K, L) - ECON.output(K, L - 1);
    if (dq <= 0.0001) return Infinity;
    return (ECON.tc(K, L) - ECON.tc(K, L - 1)) / dq;
  },

  /* AVC = WAGE/AP + MAT, so its minimum is where AP peaks */
  minAVC() { return ECON.WAGE / ECON.AP_MAX + ECON.MAT; },

  /* the lowest point of the average cost curve, and the price competition
     eventually drives the market to (zero economic profit) */
  minACL(K) {
    let bestL = 1, best = Infinity;
    for (let L = 1; L <= ECON.maxL(K); L++) {
      const a = ECON.ac(K, L);
      if (a < best) { best = a; bestL = L; }
    }
    return { L: bestL, ac: best, q: ECON.output(K, bestL) };
  },
  longRunP(K) { return Math.round(ECON.minACL(K).ac); },

  profit(K, L, P, qSoldOverride) {
    const q = qSoldOverride == null ? ECON.output(K, L) : qSoldOverride;
    return P * q - ECON.tc(K, L);
  },

  /* best labour input for a price taker facing price P */
  bestL(K, P) {
    let bestL = 0, best = -Infinity;
    const top = ECON.maxL(K);
    for (let L = 0; L <= top; L++) {
      const v = ECON.profit(K, L, P);
      if (v > best + 1e-9) { best = v; bestL = L; }
    }
    return { L: bestL, profit: best };
  },

  /* ---- market demand:  Q = A - B*P  ---------------------------------- */
  A: 300, B: 5,
  marketQ(P) { return Math.max(0, ECON.A - ECON.B * P); },
  marketP(Q) { return Math.max(0, (ECON.A - Q) / ECON.B); },
  mrFromQ(Q) { return (ECON.A - 2 * Q) / ECON.B; },   // MR of a linear demand

  /* labour needed to physically produce q units with K machines.
     Bisection on the RISING branch only: beyond the peak of total product the
     same output could be "produced" with fewer workers, and that is not a
     position any firm would choose. */
  labourFor(K, q) {
    if (q <= 0) return 0;
    if (q > ECON.output(K, K * ECON.X_TPP)) return Infinity;   // beyond capacity
    let lo = 0, hi = K * ECON.X_TPP;
    for (let i = 0; i < 100; i++) {
      const mid = (lo + hi) / 2;
      if (ECON.output(K, mid) < q) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  },

  /* profit for a price maker who sets price P, spends ad spend A,
     and owns K machines; demand multiplier comes from the caller */
  priceMaker(K, P, demMult, adFixed) {
    const q = Math.max(0, (ECON.A - ECON.B * P) * (demMult == null ? 1 : demMult));
    const L = ECON.labourFor(K, q);
    const ad = adFixed || 0;
    if (!isFinite(L)) return { q, L: Infinity, ac: Infinity, tc: Infinity, tr: P * q, profit: -Infinity, feasible: false };
    const tc = ECON.tc(K, L) + ad;
    return { q, L, ac: tc / q, tc, tr: P * q, profit: P * q - tc, feasible: true, mr: ECON.mrFromQ(q) };
  },

  /* ============================================================
     MONOPSONY — the firm as the only buyer of labour in the town
     ------------------------------------------------------------
     Until now labour came from a bottomless outside market, so the firm paid the
     going wage $90 whatever it did: supply was perfectly elastic. As the town's
     only employer there is no outside market to hire from, so the supply of
     labour slopes upwards:

         W(L) = LS_A + LS_B * L        L(W) = (W - LS_A) / LS_B

     Calibrated so that at the employment the firm was already using in the
     monopoly chapter (about 15.7 workers) the wage is exactly the $90 it used to
     pay, which keeps the two chapters comparable.

     Because hiring one more worker pushes up the pay of everyone already
     employed, the marginal factor cost sits above the wage:

         MFC(L) = LS_A + 2 * LS_B * L
     ============================================================ */
  LS_A: 33, LS_B: 3.5,

  supplyWage(L) { return ECON.LS_A + ECON.LS_B * L; },
  labourAtWage(W) { return Math.max(0, (W - ECON.LS_A) / ECON.LS_B); },
  mfc(L) { return ECON.LS_A + 2 * ECON.LS_B * L; },
  /* what one more worker is worth: marginal revenue on their output, less the
     materials those units consume */
  mrp(K, L) {
    const q = ECON.output(K, L);
    return (ECON.mrFromQ(q) - ECON.MAT) * ECON.mp(K, L);
  },

  /* the firm names a wage; the town decides how many people will work for it */
  buyerState(K, W) {
    const L = ECON.labourAtWage(W);
    const Q = ECON.output(K, L);
    const P = ECON.marketP(Q);
    const TR = P * Q;
    const tvc = W * L + ECON.MAT * Q;
    const tc = tvc + ECON.tfc(K);
    return {
      W, L, Q, P, TR, tvc, tc,
      profit: TR - tc,
      ac: Q > 0 ? tc / Q : Infinity,
      mfc: ECON.mfc(L),
      mrp: ECON.mrp(K, Math.max(L, 0.5))
    };
  },

  /* profit-maximising wage for a monopsonist, and the wage a competitive
     labour market would settle at (where supply meets marginal revenue product) */
  bestWage(K) {
    let best = null;
    for (let W = ECON.LS_A + 1; W <= 200; W += 0.25) {
      const r = ECON.buyerState(K, W);
      if (!(r.L > 1)) continue;
      if (!best || r.profit > best.profit) best = r;
    }
    return best;
  },
  competitiveWage(K) {
    let best = null;
    for (let W = ECON.LS_A + 1; W <= 220; W += 0.25) {
      const r = ECON.buyerState(K, W);
      if (!(r.L > 1)) continue;
      const gap = Math.abs(r.W - r.mrp);
      if (!best || gap < best.gap) best = Object.assign({ gap }, r);
    }
    return best;
  },

  /* The value destroyed by buying labour monopsonistically: between the
     monopsony employment and the competitive one, each worker is worth more to
     the firm than the wage they would need to be offered. That gap is never
     produced, and nobody receives it. Integrated numerically. */
  monopsonyDWL(K) {
    const best = ECON.bestWage(K), comp = ECON.competitiveWage(K);
    if (!best || !comp || !(comp.L > best.L)) return { area: 0, from: best ? best.L : 0, to: comp ? comp.L : 0 };
    const a = best.L, b = comp.L, n = 400;
    let area = 0;
    for (let i = 0; i < n; i++) {
      const L = a + (i + 0.5) * (b - a) / n;
      const gap = ECON.mrp(K, L) - ECON.supplyWage(L);
      if (gap > 0) area += gap * (b - a) / n;
    }
    return { area, from: a, to: b, gapAtBest: ECON.mrp(K, a) - best.W };
  }
};

if (typeof module !== 'undefined') module.exports = ECON;

/* ============================================================
   MARKET FORCES — number formatting, SVG chart engine, artwork
   ============================================================ */

/* ---------- the chart palette: ONE source of truth ----------
   Every diagram in the game reads its strokes from here. Hard-coding a colour
   anywhere else means a theme change has to be hunted down across five files. */
const PAL = {
  red: '#E0494D',      // marginal cost, deadweight loss, "this is a loss"
  blue: '#2F6FE0',     // average total cost
  green: '#0F9D74',    // average variable cost, profit, anything good
  violet: '#7C5CFC',   // marginal revenue, average fixed cost
  ink: '#122036',      // the point the student is standing on
  guide: '#8595AD'     // faint vertical rules and guide lines
};
Object.assign(PAL, {
  mc: PAL.red, ac: PAL.blue, avc: PAL.green, afc: PAL.violet,
  good: PAL.green, bad: PAL.red
});

/* ---------- numbers: never show float tails ---------- */
function fmt(x, d) { d = d == null ? 1 : d; if (!isFinite(x)) return '—'; return Number(x).toFixed(d); }
function money(x, d) {
  d = d == null ? 0 : d;
  if (!isFinite(x)) return '—';
  const v = Math.abs(x);
  const s = v >= 1000 ? v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : v.toFixed(d);
  return (x < 0 ? '-$' : '$') + s;
}
function pct(x, d) { return fmt(x * 100, d == null ? 0 : d) + '%'; }

function niceTicks(min, max, n) {
  const span = max - min;
  if (!(span > 0)) return [min];
  const raw = span / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
  step *= mag;
  const out = [];
  for (let v = Math.ceil(min / step - 1e-9) * step; v <= max + 1e-9; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function tickLabel(v, step) { return Math.abs(step) < 1 ? fmt(v, 1) : String(Math.round(v)); }

/* ============================================================
   map(): generic SVG line chart on a light surface
   cfg = {
     w,h, x:[min,max], y:[min,max], xLabel, yLabel,
     series:[{pts,color,width,dash,label,labelAt,labelDy,hideTail}],
     points:[{x,y,label,color,dy,dx,above}],
     shapes:[{type:'rect'|'poly',...}],
     hlines:[{y,color,dash,label,labelSide,width}],
     vlines:[{x,color,dash,label,labelTop}],
     bands:[{x0,x1,color,opacity}]
   }
   ============================================================ */
let __chartUid = 0;
/* Monotone-light cubic spline: smooths dense series without overshooting peaks */
function smoothPath(pts, X, Y) {
  if (pts.length < 3) return pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const xs = pts.map(p => X(p[0])), ys = pts.map(p => Y(p[1]));
  const d = ['M' + xs[0].toFixed(1) + ' ' + ys[0].toFixed(1)];
  const slopes = [];
  for (let i = 0; i < pts.length - 1; i++) slopes.push((ys[i + 1] - ys[i]) / Math.max(1e-6, xs[i + 1] - xs[i]));
  const tang = new Array(pts.length);
  tang[0] = slopes[0];
  tang[pts.length - 1] = slopes[slopes.length - 1];
  for (let i = 1; i < pts.length - 1; i++) {
    const a = slopes[i - 1], b = slopes[i];
    tang[i] = a * b <= 0 ? 0 : (a + b) / 2;
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = xs[i + 1] - xs[i];
    const c1x = xs[i] + dx / 3, c1y = ys[i] + tang[i] * dx / 3;
    const c2x = xs[i + 1] - dx / 3, c2y = ys[i + 1] - tang[i + 1] * dx / 3;
    d.push('C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + xs[i + 1].toFixed(1) + ' ' + ys[i + 1].toFixed(1));
  }
  return d.join(' ');
}
function chart(cfg) {
  const W = cfg.w || 680, H = cfg.h || 380;
  const pad = Object.assign({ l: 64, r: 92, t: 28, b: 52 }, cfg.pad || {});
  /* end-of-line labels are drawn just past the last data point: make the right
     gutter wide enough for the longest of them so nothing escapes the viewBox */
  let maxLab = 0;
  (cfg.series || []).forEach(s => {
    if (s.label && !s.labelAt && s.pts && s.pts.length) maxLab = Math.max(maxLab, String(s.label).length);
  });
  if (maxLab) pad.r = Math.max(pad.r, Math.min(210, maxLab * 0.76 * 19 * 0.60 + 18));
  pad.r = Math.min(pad.r, Math.max(70, Math.round(W * 0.30)));
  const x0 = pad.l, x1 = W - pad.r, y0 = H - pad.b, y1 = pad.t;
  const X = v => x0 + (v - cfg.x[0]) / (cfg.x[1] - cfg.x[0]) * (x1 - x0);
  const Y = v => y0 - (v - cfg.y[0]) / (cfg.y[1] - cfg.y[0]) * (y0 - y1);
  const out = [];
  const uid = ++__chartUid;
  out.push(`<rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="14" fill="#FFFFFF" stroke="#EDF1F8"/>`);

  const xt = niceTicks(cfg.x[0], cfg.x[1], cfg.xTicks || 6);
  const yt = niceTicks(cfg.y[0], cfg.y[1], cfg.yTicks || 5);
  const xs = xt.length > 1 ? xt[1] - xt[0] : 1, ys = yt.length > 1 ? yt[1] - yt[0] : 1;

  // gradient defs for area fills
  const defs = [];
  (cfg.series || []).forEach((s, i) => {
    if (s.area) {
      s._gid = `mfG${uid}_${i}`;
      defs.push(`<linearGradient id="${s._gid}" x1="0" y1="0" x2="0" y2="1">`
        + `<stop offset="0%" stop-color="${s.color}" stop-opacity="${s.area}"/>`
        + `<stop offset="100%" stop-color="${s.color}" stop-opacity="0.005"/></linearGradient>`);
    }
  });
  if (defs.length) out.push(`<defs>${defs.join('')}</defs>`);

  // grid
  xt.forEach(v => out.push(`<line class="gr" x1="${X(v).toFixed(1)}" y1="${y0}" x2="${X(v).toFixed(1)}" y2="${y1}"/>`));
  yt.forEach(v => out.push(`<line class="gr" x1="${x0}" y1="${Y(v).toFixed(1)}" x2="${x1}" y2="${Y(v).toFixed(1)}"/>`));

  // bands
  (cfg.bands || []).forEach(b => out.push(
    `<rect class="zone-good" x="${X(b.x0).toFixed(1)}" y="${y1}" width="${(X(b.x1) - X(b.x0)).toFixed(1)}" height="${y0 - y1}" fill="${b.color}" opacity="${b.opacity == null ? .16 : b.opacity}"/>`));

  // shapes
  (cfg.shapes || []).forEach(s => {
    if (s.type === 'rect') {
      const xa = Math.min(X(s.x0), X(s.x1)), wa = Math.abs(X(s.x1) - X(s.x0));
      const ya = Math.min(Y(s.y0), Y(s.y1)), ha = Math.abs(Y(s.y1) - Y(s.y0));
      out.push(`<rect x="${xa.toFixed(1)}" y="${ya.toFixed(1)}" width="${wa.toFixed(1)}" height="${ha.toFixed(1)}" rx="4" fill="${s.fill}" opacity="${s.opacity == null ? .18 : s.opacity}" stroke="${s.stroke || 'none'}" stroke-width="${s.sw || 1.4}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    } else if (s.type === 'poly') {
      const p = s.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
      out.push(`<polygon points="${p}" fill="${s.fill || 'none'}" opacity="${s.opacity == null ? .2 : s.opacity}" stroke="${s.stroke || 'none'}" stroke-width="${s.sw || 1.4}" stroke-linejoin="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    }
  });

  // hlines
  (cfg.hlines || []).forEach(l => {
    if (l.y < cfg.y[0] || l.y > cfg.y[1]) return;
    out.push(`<line x1="${x0}" y1="${Y(l.y).toFixed(1)}" x2="${x1}" y2="${Y(l.y).toFixed(1)}" stroke="${l.color}" stroke-width="${l.width || 2.2}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''}/>`);
    if (l.label) {
      const lx = l.labelSide === 'left' ? x0 + 6 : x1 - 6;
      const anch = l.labelSide === 'left' ? 'start' : 'end';
      out.push(`<text class="cl" x="${lx}" y="${(Y(l.y) - 7).toFixed(1)}" text-anchor="${anch}" fill="${l.color}" stroke="#fff" stroke-width="3.4" paint-order="stroke">${l.label}</text>`);
    }
  });

  // vlines
  (cfg.vlines || []).forEach((l, i) => {
    if (l.x < cfg.x[0] || l.x > cfg.x[1]) return;
    out.push(`<line x1="${X(l.x).toFixed(1)}" y1="${y0}" x2="${X(l.x).toFixed(1)}" y2="${y1}" stroke="${l.color}" stroke-width="1.8" stroke-dasharray="5 4"/>`);
    if (l.label) {
      // labels sit just above the x-axis: the top of the plot is where the curve
      // labels live, and stacking there caused collisions
      const nearRight = X(l.x) > (x0 + x1) / 2;
      out.push(`<text class="cl" x="${(X(l.x) + (nearRight ? -7 : 7)).toFixed(1)}" y="${(y0 - 9 - i * 17).toFixed(1)}" text-anchor="${nearRight ? 'end' : 'start'}" fill="${l.color}" stroke="#fff" stroke-width="3.4" paint-order="stroke">${l.label}</text>`);
    }
  });

  // series
  (cfg.series || []).forEach(s => {
    const pts = s.pts.filter(p => p[0] >= cfg.x[0] - 1e-6 && p[0] <= cfg.x[1] + 1e-6 && isFinite(p[1]));
    if (!pts.length) return;
    const d = s.smooth === false ? pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ') : smoothPath(pts, X, Y);
    if (s.area && s._gid) {
      const base = `L${X(pts[pts.length - 1][0]).toFixed(1)} ${y0} L${X(pts[0][0]).toFixed(1)} ${y0} Z`;
      out.push(`<path d="${d} ${base}" fill="url(#${s._gid})" stroke="none"/>`);
    }
    out.push(`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.6}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`);
    if (s.label) {
      let lx, ly, anch = 'start';
      if (s.labelAt) { lx = X(s.labelAt[0]); ly = Y(s.labelAt[1]); }
      else { const last = pts[pts.length - 1]; lx = X(last[0]) + 8; ly = Y(last[1]) + 4; }
      if (s.labelAnchor) anch = s.labelAnchor;
      if (s.labelEnd && !s.labelAt) { const last = pts[pts.length - 1]; lx = X(last[0]) + 8; ly = Y(last[1]) + 4; }
      out.push(`<text class="cl" x="${lx.toFixed(1)}" y="${(ly + (s.labelDy || 0)).toFixed(1)}" text-anchor="${anch}" fill="${s.color}" stroke="#fff" stroke-width="3.6" paint-order="stroke">${s.label}</text>`);
    }
    // dots on the series
    (s.dots || []).forEach(dt => {
      const q = pts.reduce((a, b) => Math.abs(b[0] - dt) < Math.abs(a[0] - dt) ? b : a);
      out.push(`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2.2"/>`);
    });
  });

  // scatter points
  (cfg.points || []).forEach(p => {
    const cx = X(p.x), cy = Y(p.y);
    if (p.r === 0) {
      if (p.label) {
        out.push(`<text class="cn" x="${cx.toFixed(1)}" y="${cy.toFixed(1)}" text-anchor="${p.anchor || 'start'}" fill="${p.color || PAL.ink}" stroke="#fff" stroke-width="3.6" paint-order="stroke" font-style="italic">${p.label}</text>`);
      }
      return;
    }
    out.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(p.r || 5.5) + 1}" fill="#fff" opacity=".9"/>`);
    out.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${p.r || 5.5}" fill="${p.color || PAL.ink}" stroke="#fff" stroke-width="2.4"/>`);
    if (p.label) {
      const dx = p.dx == null ? 9 : p.dx, dy = p.dy == null ? 5 : p.dy;
      out.push(`<text class="cn" x="${(cx + dx).toFixed(1)}" y="${(cy + dy).toFixed(1)}" text-anchor="${p.anchor || 'start'}" fill="${p.color || PAL.ink}" stroke="#fff" stroke-width="3.6" paint-order="stroke">${p.label}</text>`);
    }
  });

  // axes with arrowheads
  out.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x1 + 6}" y2="${y0}"/>`);
  out.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1 - 6}"/>`);
  out.push(`<path d="M${x1 + 6} ${y0} l-7 -3.4 v6.8 Z" fill="#B9C6D9"/>`);
  out.push(`<path d="M${x0} ${y1 - 6} l-3.4 7 h6.8 Z" fill="#B9C6D9"/>`);
  xt.forEach(v => out.push(`<text class="ct" x="${X(v).toFixed(1)}" y="${y0 + 17}" text-anchor="middle">${tickLabel(v, xs)}</text>`));
  yt.forEach(v => out.push(`<text class="ct" x="${x0 - 9}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${tickLabel(v, ys)}</text>`));
  if (cfg.xLabel) out.push(`<text class="ca" x="${((x0 + x1) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${cfg.xLabel}</text>`);
  if (cfg.yLabel) out.push(`<text class="ca" x="16" y="${((y0 + y1) / 2).toFixed(1)}" text-anchor="middle" transform="rotate(-90 16 ${((y0 + y1) / 2).toFixed(1)})">${cfg.yLabel}</text>`);
  if (cfg.note) out.push(`<text class="ct" x="${x1}" y="${y1 - 8}" text-anchor="end" font-style="italic">${cfg.note}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out.join('')}</svg>`;
}

/* ---- product-specific capital goods: every industry gets its own machine,
   all drawn in one metal-and-brand-colour language ---- */
function machineArt(kind, x, t, w, c) {
  const M = '#EDF3FA', M2 = '#DCE5F0', edge = '#B6C4D6', dark = '#23314B', g = [];
  const flue = () => {
    g.push(`<rect x="${x + 11}" y="52" width="9" height="10" rx="3" fill="${M2}" stroke="${edge}" stroke-width="1.1"/>`);
    g.push(`<path d="M${x + 13.5} 51 q3 -4 0 -7 M${x + 18} 51 q3 -4 0 -7" stroke="#C9D6E8" stroke-width="1.5" fill="none" stroke-linecap="round"/>`);
  };
  const body = () => g.push(`<rect x="${x}" y="${t}" width="${w}" height="56" rx="11" fill="${M}" stroke="${edge}" stroke-width="1.6"/>`);
  const knob = (kx, ky) => g.push(`<circle cx="${kx}" cy="${ky}" r="3" fill="#fff" stroke="${c}" stroke-width="2"/>`);
  const led = () => g.push(`<circle cx="${x + 50}" cy="${t + 45}" r="2.6" fill="#fff"/><circle cx="${x + 50}" cy="${t + 45}" r="1.8" fill="${c}"/>`);

  if (kind === 'oven') {
    body();
    g.push(`<rect x="${x + 3}" y="${t + 3}" width="${w - 6}" height="16" rx="8" fill="#fff" opacity=".72"/>`);
    g.push(`<circle cx="${x + 17}" cy="${t + 11}" r="4.6" fill="none" stroke="${c}" stroke-width="2.2"/>`);
    g.push(`<circle cx="${x + 32}" cy="${t + 11}" r="4.6" fill="none" stroke="${c}" stroke-width="2.2"/>`);
    g.push(`<rect x="${x + 8}" y="${t + 22}" width="46" height="26" rx="7" fill="${dark}"/>`);
    g.push(`<rect x="${x + 11}" y="${t + 25}" width="40" height="20" rx="5" fill="#F6B24E" opacity=".22"/>`);
    g.push(`<path d="M${x + 22} ${t + 38}c0-6 4-9 9-9s9 3 9 9z" fill="#F2BC63" opacity=".92"/>`);
    g.push(`<rect x="${x + 13}" y="${t + 33}" width="36" height="3.6" rx="1.8" fill="${M2}"/>`);
    knob(x + 48, t + 11); led();
  } else if (kind === 'roaster') {
    flue(); body();
    g.push(`<rect x="${x + 7}" y="${t + 11}" width="48" height="27" rx="13.5" fill="#fff" stroke="${edge}" stroke-width="1.4"/>`);
    g.push(`<circle cx="${x + 31}" cy="${t + 24.5}" r="11" fill="${dark}"/>`);
    [[26, 22], [34, 25], [30, 29]].forEach(([bx, by]) =>
      g.push(`<ellipse cx="${x + bx}" cy="${t + by}" rx="2.6" ry="3.4" fill="#A9743C" transform="rotate(24 ${x + bx} ${t + by})"/>`));
    g.push(`<path d="M${x + 39} ${t + 20}a9 9 0 1 0 2 8" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`);
    g.push(`<path d="M${x + 42} ${t + 25}l3 .4l-1.6 2.6" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`);
    g.push(`<path d="M${x + 14} ${t + 40}h34l-4 10h-26z" fill="${M2}" stroke="${edge}" stroke-width="1.2"/>`);
    g.push(`<circle cx="${x + 24}" cy="${t + 46}" r="1.6" fill="#8A5A2E"/><circle cx="${x + 31}" cy="${t + 47}" r="1.6" fill="#8A5A2E"/><circle cx="${x + 38}" cy="${t + 46}" r="1.6" fill="#8A5A2E"/>`);
    knob(x + 49, t + 11); led();
  } else if (kind === 'press') {
    body();
    g.push(`<rect x="${x + 8}" y="${t + 44}" width="46" height="10" rx="4" fill="${M2}" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<rect x="${x + 28}" y="${t + 8}" width="7" height="38" rx="2.5" fill="${M2}" stroke="${edge}" stroke-width="1.1"/>`);
    g.push(`<rect x="${x + 11}" y="${t + 9}" width="40" height="11" rx="4.5" fill="${c}"/>`);
    g.push(`<rect x="${x + 11}" y="${t + 9}" width="40" height="5" rx="2.5" fill="#fff" opacity=".22"/>`);
    g.push(`<rect x="${x + 11}" y="${t + 34}" width="40" height="9" rx="4" fill="#fff" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<path d="M${x + 26} ${t + 24}l-5-4 2-5h12l2 5-5 4v6h-6z" fill="${c}" opacity=".85"/>`);
    g.push(`<circle cx="${x + 50}" cy="${t + 14}" r="3.4" fill="#fff" stroke="${c}" stroke-width="2"/>`);
    led();
  } else if (kind === 'lathe') {
    body();
    g.push(`<rect x="${x + 5}" y="${t + 34}" width="52" height="9" rx="3.5" fill="${M2}" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<rect x="${x + 8}" y="${t + 10}" width="15" height="26" rx="3" fill="${M}" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<circle cx="${x + 22}" cy="${t + 24}" r="5" fill="#fff" stroke="${c}" stroke-width="2.2"/>`);
    g.push(`<path d="M${x + 19} ${t + 21}l6 6M${x + 28} ${t + 21}l-6 6" stroke="${c}" stroke-width="1.4"/>`);
    g.push(`<rect x="${x + 24}" y="${t + 21}" width="20" height="5" rx="2" fill="#C8945E" stroke="#A06F3C" stroke-width="1"/>`);
    g.push(`<rect x="${x + 44}" y="${t + 18}" width="10" height="16" rx="2.5" fill="${M}" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<path d="M${x + 37} ${t + 34}l4-7 4 7z" fill="${c}" opacity=".85"/>`);
    knob(x + 13, t + 15); led();
  } else if (kind === 'vat') {
    body();
    g.push(`<rect x="${x + 7}" y="${t + 14}" width="48" height="38" rx="12" fill="${M}" stroke="${edge}" stroke-width="1.6"/>`);
    g.push(`<path d="M${x + 10} ${t + 24}a14 6 0 0 0 28 0a14 6 0 0 0 14 0v16a9 9 0 0 1-9 9h-38a9 9 0 0 1-9-9z" fill="${c}" opacity=".16"/>`);
    g.push(`<ellipse cx="${x + 24}" cy="${t + 24}" rx="14" ry="5" fill="${c}" opacity=".28"/>`);
    g.push(`<circle cx="${x + 18}" cy="${t + 20}" r="1.8" fill="#fff" opacity=".75"/><circle cx="${x + 27}" cy="${t + 17}" r="1.4" fill="#fff" opacity=".75"/><circle cx="${x + 33}" cy="${t + 21}" r="1.6" fill="#fff" opacity=".75"/>`);
    g.push(`<line x1="${x + 31}" y1="${t + 2}" x2="${x + 31}" y2="${t + 30}" stroke="${edge}" stroke-width="3" stroke-linecap="round"/>`);
    g.push(`<ellipse cx="${x + 31}" cy="${t + 31}" rx="7" ry="3" fill="${c}"/>`);
    g.push(`<rect x="${x + 27}" y="${t + 46}" width="8" height="7" rx="2" fill="${M2}" stroke="${edge}" stroke-width="1.1"/>`);
    led();
  } else if (kind === 'polytunnel') {
    body();
    g.push(`<rect x="${x + 6}" y="${t + 40}" width="50" height="12" rx="4" fill="${M2}" stroke="${edge}" stroke-width="1.3"/>`);
    g.push(`<path d="M${x + 9} ${t + 40}a22 22 0 0 1 44 0z" fill="#EAF7EF" stroke="#7FC497" stroke-width="1.7"/>`);
    [0, 1, 2].forEach(i => {
      const a = x + 17 + i * 14;
      g.push(`<path d="M${a - 6} ${t + 40}a20 20 0 0 1 12-19" fill="none" stroke="#7FC497" stroke-width="1.1" opacity=".7"/>`);
      g.push(`<path d="M${a} ${t + 40}v-7" stroke="#3F9755" stroke-width="1.6" stroke-linecap="round"/>`);
      g.push(`<ellipse cx="${a - 2.6}" cy="${t + 31}" rx="3" ry="1.8" fill="#57B46A" transform="rotate(-28 ${a - 2.6} ${t + 31})"/>`);
      g.push(`<ellipse cx="${a + 2.6}" cy="${t + 31}" rx="3" ry="1.8" fill="#459E59" transform="rotate(28 ${a + 2.6} ${t + 31})"/>`);
    });
    g.push(`<line x1="${x + 31}" y1="${t + 22}" x2="${x + 31}" y2="${t + 40}" stroke="#7FC497" stroke-width="1.2" stroke-dasharray="2 2"/>`);
    led();
  } else {
    /* generic machine: gearbox */
    body();
    g.push(`<rect x="${x + 2}" y="${t + 2}" width="${w - 4}" height="17" rx="9" fill="#fff" opacity=".75"/>`);
    const gx = x + 20, gy = t + 26;
    for (let a = 0; a < 6; a++) {
      const ang = a * Math.PI / 3;
      g.push(`<line x1="${(gx + Math.cos(ang) * 10.5).toFixed(1)}" y1="${(gy + Math.sin(ang) * 10.5).toFixed(1)}" x2="${(gx + Math.cos(ang) * 14).toFixed(1)}" y2="${(gy + Math.sin(ang) * 14).toFixed(1)}" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`);
    }
    g.push(`<circle cx="${gx}" cy="${gy}" r="10.5" fill="#fff" stroke="${c}" stroke-width="2.6"/>`);
    g.push(`<circle cx="${gx}" cy="${gy}" r="3.4" fill="${c}"/>`);
    g.push(`<rect x="${x + 37}" y="${t + 16}" width="18" height="18" rx="4" fill="${dark}"/>`);
    g.push(`<rect x="${x + 40.5}" y="${t + 20.5}" width="11" height="2.6" rx="1.3" fill="${c}" opacity=".95"/>`);
    g.push(`<rect x="${x + 40.5}" y="${t + 26}" width="7" height="2.6" rx="1.3" fill="${c}" opacity=".55"/>`);
    led();
  }
  return g.join('');
}

/* ---- a small worker: hard hat, overalls, soft shadow ---- */
function workerArt(cx, cy, r, colour, dark) {
  const n = v => (Number(v)).toFixed(1);
  const x = cx, y = cy;
  return [
    `<ellipse cx="${n(x)}" cy="${n(y + r * 2.25)}" rx="${n(r * .98)}" ry="${n(r * .3)}" fill="rgba(18,32,54,.10)"/>`,
    /* legs */
    `<rect x="${n(x - r * .56)}" y="${n(y + r * 1.28)}" width="${n(r * .44)}" height="${n(r * .92)}" rx="${n(r * .16)}" fill="#334155"/>`,
    `<rect x="${n(x + r * .12)}" y="${n(y + r * 1.28)}" width="${n(r * .44)}" height="${n(r * .92)}" rx="${n(r * .16)}" fill="#3D4D66"/>`,
    /* arms */
    `<rect x="${n(x - r * .98)}" y="${n(y + r * .18)}" width="${n(r * .34)}" height="${n(r * 1.12)}" rx="${n(r * .17)}" fill="${dark}"/>`,
    `<rect x="${n(x + r * .64)}" y="${n(y + r * .18)}" width="${n(r * .34)}" height="${n(r * 1.12)}" rx="${n(r * .17)}" fill="${dark}"/>`,
    `<circle cx="${n(x - r * .81)}" cy="${n(y + r * 1.34)}" r="${n(r * .17)}" fill="#F4CBA6"/>`,
    `<circle cx="${n(x + r * .81)}" cy="${n(y + r * 1.34)}" r="${n(r * .17)}" fill="#EBB98E"/>`,
    /* torso overalls */
    `<rect x="${n(x - r * .82)}" y="${n(y + r * .04)}" width="${n(r * 1.64)}" height="${n(r * 1.5)}" rx="${n(r * .62)}" fill="${colour}"/>`,
    `<rect x="${n(x - r * .3)}" y="${n(y + .06 * r)}" width="${n(r * .6)}" height="${n(r * .52)}" rx="${n(r * .14)}" fill="#fff" opacity=".18"/>`,
    /* head */
    `<circle cx="${n(x)}" cy="${n(y - r * .56)}" r="${n(r * .6)}" fill="#F4CBA6"/>`,
    /* hard hat */
    `<path d="M${n(x - r * .66)} ${n(y - r * .58)} A${n(r * .66)} ${n(r * .66)} 0 0 1 ${n(x + r * .66)} ${n(y - r * .58)} Z" fill="${dark}"/>`,
    `<rect x="${n(x - r * .76)}" y="${n(y - r * .64)}" width="${n(r * 1.52)}" height="${n(r * .26)}" rx="${n(r * .13)}" fill="${dark}"/>`,
    `<rect x="${n(x - r * .42)}" y="${n(y - r * 1.02)}" width="${n(r * .4)}" height="${n(r * .16)}" rx="${n(r * .08)}" fill="#fff" opacity=".28"/>`
  ].join('');
}

    o.push(`<rect x="${px-3}" y="${py-3}" width="6" height="6" rx="1.6" fill="#fff" stroke="${colour}" stroke-opacity=".55" stroke-width="1.4"/>`));

  for (let rx = 40; rx < W - 40; rx += 42) o.push(`<circle cx="${rx}" cy="209" r="2.4" fill="#C2CEDF"/>`);
  // raw-material crates travelling in
  [44, 73, 102].forEach(bx => {
    o.push(`<rect x="${bx}" y="194" width="14" height="12" rx="2" fill="#E6C08A" stroke="#B98A4E" stroke-width="1.2"/>`);

  });
  // finished goods going out: a parcel carrying the product itself
  const ox = W - 114;
  o.push(`<ellipse cx="${ox + 13}" cy="211" rx="13" ry="2.4" fill="rgba(18,32,54,.10)"/>`);
  o.push(`<rect x="${ox}" y="189" width="26" height="20" rx="4.5" fill="#fff" stroke="${colour}" stroke-width="1.7"/>`);

    // name plate (long machine names get a short tag so plates never overlap)
    const CAP_SHORT = { polytunnel: 'tunnel' };
    const plateLabel = `${CAP_SHORT[prod.cap] || prod.cap} ${i + 1}`;
    const pw = Math.max(54, Math.min(70, plateLabel.length * 6.7 + 12));
    o.push(`<rect x="${cx - pw / 2}" y="123" width="${pw}" height="15" rx="7.5" fill="#fff" stroke="#DCE4EF" stroke-width="1.1"/>`);
    o.push(`<text class="ct" x="${cx}" y="133.5" text-anchor="middle" font-weight="700" font-size="${plateLabel.length > 8 ? 9.5 : 11}">${plateLabel}</text>`);
  }

  // workers
  const wStart = 26 + K * (mw + gap) + 16;
  const avail = W - 22 - wStart;
  const perRow = Math.max(6, Math.min(13, L || 1));
  const cw = Math.min(34, avail / perRow);
  const r = Math.max(3.4, Math.min(7, cw * 0.24));
  for (let i = 0; i < L; i++) {
    const row = Math.floor(i / perRow), col = i % perRow;
    const cx = wStart + cw * (col + 0.5);
    const cy = 84 + row * 46;
    o.push(workerArt(cx, cy, r, colour, dark));
  }
  o.push(`<text class="ca" x="${W - 22}" y="47" text-anchor="end" fill="${colour}">LABOUR &#183; variable &#183; ${L} worker${L === 1 ? '' : 's'}</text>`);

  // material in / output out
  const q = ECON.output(K, L);
  o.push(`<text class="ct" x="26" y="${H - 28}">RAW MATERIALS in: $${ECON.MAT} per unit</text>`);
  o.push(`<text class="ct" x="${W - 26}" y="${H - 28}" text-anchor="end">OUTPUT: <tspan class="cn" fill="${colour}">${fmt(q, 1)} units</tspan></text>`);
  if (opt.crowd && L > 4 * K) {
    o.push(`<text class="cl" x="26" y="186" fill="#C97A13" stroke="#fff" stroke-width="3.4" paint-order="stroke">crowded: too many workers per ${prod.cap}</text>`);
  }
  if (opt.lazy && L < 4 * K) {
    o.push(`<text class="cl" x="26" y="186" fill="#C97A13" stroke="#fff" stroke-width="3.4" paint-order="stroke">${prod.caps} are idle: spare capacity</text>`);
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${o.join('')}</svg>`;
}

/* ---- demand & supply schematic used in the intro cards ---- */
function artMarketDiagram(colour) {
  const o = [];

  const x0 = 70, x1 = 630, y0 = 210, y1 = 30;
  const X = v => x0 + v / 100 * (x1 - x0);
  const Y = v => y0 - v / 100 * (y0 - y1);

  o.push(`<polygon points="${X(10)},${Y(20)} ${X(50)},${Y(51)} ${X(10)},${Y(51)}" fill="${PAL.green}" opacity=".07"/>`);

  o.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x1 + 8}" y2="${y0}"/>`);
  o.push(`<line class="ax" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1 - 8}"/>`);
  o.push(`<path d="M${x1 + 8} ${y0} l-8 -3.6 v7.2 Z" fill="#B9C6D9"/>`);
  o.push(`<path d="M${x0} ${y1 - 8} l-3.6 8 h7.2 Z" fill="#B9C6D9"/>`);

  o.push(`<path d="M${X(10)} ${Y(80)} Q${X(48)} ${Y(56)} ${X(90)} ${Y(22)}" stroke="${PAL.red}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`);
  o.push(`<path d="M${X(10)} ${Y(20)} Q${X(48)} ${Y(46)} ${X(90)} ${Y(82)}" stroke="${PAL.green}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`);
  // equilibrium guides
  o.push(`<line x1="${x0}" y1="${Y(51)}" x2="${X(50)}" y2="${Y(51)}" stroke="#C7D2E3" stroke-dasharray="5 4" stroke-width="1.6"/>`);
  o.push(`<line x1="${X(50)}" y1="${Y(51)}" x2="${X(50)}" y2="${y0}" stroke="#C7D2E3" stroke-dasharray="5 4" stroke-width="1.6"/>`);
  o.push(`<circle cx="${X(50)}" cy="${Y(51)}" r="10" fill="${PAL.ink}" opacity=".12"/>`);
  o.push(`<circle cx="${X(50)}" cy="${Y(51)}" r="6" fill="${PAL.ink}" stroke="#fff" stroke-width="2.6"/>`);
  o.push(`<text class="cl" x="${X(88)}" y="${Y(20)}" fill="${PAL.red}" stroke="#fff" stroke-width="3.6" paint-order="stroke">Demand</text>`);
  o.push(`<text class="cl" x="${X(88)}" y="${Y(84)}" fill="${PAL.green}" stroke="#fff" stroke-width="3.6" paint-order="stroke">Supply</text>`);
  o.push(`<text class="ct" x="${X(50)}" y="${y0 + 16}" text-anchor="middle" font-weight="800">Q*</text>`);
  o.push(`<text class="ct" x="${x0 - 9}" y="${Y(51) + 4}" text-anchor="end" font-weight="800">P*</text>`);
  o.push(`<text class="ca" x="${(x0 + x1) / 2}" y="${H - 8}" text-anchor="middle">Quantity (units per period)</text>`);
  o.push(`<text class="ca" x="20" y="${(y0 + y1) / 2}" text-anchor="middle" transform="rotate(-90 20 ${(y0 + y1) / 2})">Price ($)</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${o.join('')}</svg>`;
}

/* ---------------- sliders: drag to explore, click to land on a value -------
   Every range input in the game is wrapped in this, so the player gets a − and
   a + either side of it. One click moves exactly one step of that slider's own
   `step`, which is how you land on a precise number instead of hunting for it
   with the mouse. */
function sliderRow(attr, min, max, step, value, ticks) {
  return `<div class="srow">
    <button class="sbtn" data-a="step" data-i="${attr}" data-d="-1" aria-label="decrease" title="one less">\u2212</button>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-i="${attr}">
    <button class="sbtn" data-a="step" data-i="${attr}" data-d="1" aria-label="increase" title="one more">+</button>
  </div>${ticks || ''}`;
}
ACTS['step'] = t => {
  const name = t.dataset.i, dir = +t.dataset.d;
  /* target the input itself: the buttons carry the same data-i */
  const el = q('input[data-i="' + name + '"]');
  if (!el) return;
  const min = +el.min, max = +el.max, st = +(el.step || 1);
  const next = Math.min(max, Math.max(min, (+el.value) + dir * st));
  if (next === +el.value) return;              // already at the end of the range
  el.value = String(next);
  el.dispatchEvent(new Event('input', { bubbles: true }));
  /* the same "let go" signal a drag produces, so a clicked value is recorded
     in the lab notebook too */
  el.dispatchEvent(new Event('change', { bubbles: true }));
};
