<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8B8BA8"/></marker>
    <clipPath id="kidbar"><rect x="546" y="136" width="298" height="36" rx="7"/></clipPath>
  </defs>
  <rect width="900" height="430" fill="#FBFAF7"/>

  <rect x="36" y="20" width="18" height="14" rx="3" fill="#3D6FD8"/>
  <text x="62" y="32" font-size="14" fill="#3A3A55">来自父亲的染色体</text>
  <rect x="230" y="20" width="18" height="14" rx="3" fill="#E2605C"/>
  <text x="256" y="32" font-size="14" fill="#3A3A55">来自母亲的染色体</text>

  <rect x="36" y="66" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#DEDEE8"/>
  <text x="56" y="92" font-size="17" font-weight="700" fill="#2A2A45">爸爸</text>
  <rect x="56" y="102" width="190" height="13" rx="4" fill="#3D6FD8" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="56" y="119" width="190" height="13" rx="4" fill="#A9C2F0" opacity="0.7"/>
  <text x="56" y="156" font-size="13" fill="#5A5A78">有两套，只传一套给孩子</text>
  <text x="56" y="178" font-size="13" font-weight="700" fill="#3D6FD8">深色这套传下去了</text>

  <rect x="36" y="216" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#DEDEE8"/>
  <text x="56" y="242" font-size="17" font-weight="700" fill="#2A2A45">妈妈</text>
  <rect x="56" y="252" width="190" height="13" rx="4" fill="#E2605C" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="56" y="269" width="190" height="13" rx="4" fill="#F3C4C1" opacity="0.8"/>
  <text x="56" y="306" font-size="13" fill="#5A5A78">有两套，只传一套给孩子</text>
  <text x="56" y="328" font-size="13" font-weight="700" fill="#C04A46">深色这套传下去了</text>

  <line x1="250" y1="108" x2="518" y2="166" stroke="#8B8BA8" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="250" y1="258" x2="518" y2="240" stroke="#8B8BA8" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="526" y="88" width="338" height="232" rx="12" fill="#FFFFFF" stroke="#DEDEE8"/>
  <text x="546" y="118" font-size="17" font-weight="700" fill="#2A2A45">孩子</text>
  <g clip-path="url(#kidbar)">
    <rect x="546" y="136" width="149" height="36" fill="#3D6FD8"/>
    <rect x="695" y="136" width="149" height="36" fill="#E2605C"/>
  </g>
  <text x="546" y="196" font-size="13" fill="#3D6FD8">左半：与爸爸重复</text>
  <text x="695" y="196" font-size="13" fill="#C04A46">右半：与妈妈重复</text>
  <line x1="546" y1="212" x2="844" y2="212" stroke="#E4E4EE" stroke-width="1"/>
  <text x="546" y="242" font-size="14" fill="#2A2A45">一套蓝 + 一套红，各占一半</text>
  <text x="546" y="272" font-size="15" font-weight="700" fill="#2A2A45">与爸爸 r = 0.5　　与妈妈 r = 0.5</text>

  <rect x="36" y="372" width="828" height="42" rx="10" fill="#EEF1FB"/>
  <text x="450" y="399" font-size="16" font-weight="700" fill="#3A4A8A" text-anchor="middle">爸妈各有两套染色体，各只传一套 → 孩子一半与爸爸重复、一半与妈妈重复</text>
</svg>
